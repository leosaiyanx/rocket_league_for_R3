    if (!stickEl) return;

    var st = I.touch;
    st.stick = { id: null, cx: 0, cy: 0, x: 0, y: 0, el: stickEl, knob: knobEl };

    var R = 62;   // stick radius in px

    function place(t) {
      var s = st.stick;
      var dx = t.clientX - s.cx, dy = t.clientY - s.cy;
      var len = Math.hypot(dx, dy);
      if (len > R) { dx *= R / len; dy *= R / len; }
      s.x = dx / R; s.y = dy / R;
      if (s.knob) s.knob.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';
    }

    stickEl.addEventListener('touchstart', function (e) {
      e.preventDefault();
      var t = e.changedTouches[0];
      var r = stickEl.getBoundingClientRect();
      st.stick.id = t.identifier;
      st.stick.cx = r.left + r.width / 2;
      st.stick.cy = r.top + r.height / 2;
      I.lastSource = 'touch';
      place(t);
    }, { passive: false });

    document.addEventListener('touchmove', function (e) {
      var s = st.stick;
      if (s.id === null) return;
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === s.id) { e.preventDefault(); place(e.changedTouches[i]); }
      }
    }, { passive: false });

    function endTouch(e) {
      var s = st.stick;
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === s.id) {
          s.id = null; s.x = 0; s.y = 0;
          if (s.knob) s.knob.style.transform = 'translate(0px,0px)';
        }
      }
    }
    document.addEventListener('touchend', endTouch);
    document.addEventListener('touchcancel', endTouch);

    // action buttons
    ['tBoost', 'tJump', 'tBrake', 'tDrift', 'tRoll'].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      var key = id.slice(1).toLowerCase();
      st.buttons[key] = false;
      function on(e) {
        e.preventDefault();
        st.buttons[key] = true;
        el.classList.add('held');
        I.lastSource = 'touch';
        if (key === 'jump') I.edges.jump = true;
      }
      function off(e) { e.preventDefault(); st.buttons[key] = false; el.classList.remove('held'); }
      el.addEventListener('touchstart', on, { passive: false });
      el.addEventListener('touchend', off, { passive: false });
      el.addEventListener('touchcancel', off, { passive: false });
      // mouse fallback so the layout can be checked on a desktop
      el.addEventListener('mousedown', on);
      el.addEventListener('mouseup', off);
      el.addEventListener('mouseleave', off);
    });
  }

  /* ---------------- public API ---------------- */

  I.init = function () {
    global.addEventListener('keydown', onKeyDown);
    global.addEventListener('keyup', onKeyUp);
    global.addEventListener('blur', onBlur);
    global.addEventListener('gamepadconnected', function (e) {
      I.hasPad = true; I.padIndex = e.gamepad.index; I.lastSource = 'gamepad';
    });
    global.addEventListener('gamepaddisconnected', function () { I.hasPad = false; });
    initTouch();
    I.autoThrottle = RL.isTouch;
  };

  /* Keyboard steering is a hard on/off switch, which makes the car snap to
     full lock and feel impossible to place. Easing it in over ~0.2s (and
     releasing faster than it engages) is what makes a keyboard feel like a
     stick. Analog sources bypass this entirely — they're already smooth. */
  I._kbSteer = 0;
  function rampSteer(target, dt) {
    if (!RL.save.smoothSteer) return target;
    var rate = (target === 0 ? 9.0 : 5.5);
    var d = target - I._kbSteer;
    var step = rate * dt;
    if (Math.abs(d) <= step) I._kbSteer = target;
    else I._kbSteer += (d > 0 ? step : -step);
    return I._kbSteer;
  }

  /* Fill `out` with this frame's controls. */
  I.poll = function (out, dt) {
    var dz = RL.save.deadzone, sens = RL.save.steerSens;
    dt = (dt > 0 && dt < 0.1) ? dt : 1 / 60;
    var th = 0, st = 0, jump = false, boost = false, drift = false, roll = 0, airRoll = false;

    /* keyboard */
    if (I.isDown('throttle')) th += 1;
    if (I.isDown('reverse')) th -= 1;
    var kb = 0;
    if (I.isDown('left')) kb -= 1;
    if (I.isDown('right')) kb += 1;
    st += rampSteer(kb, dt);
    if (I.isDown('jump')) jump = true;
    if (I.isDown('boost')) boost = true;
    if (I.isDown('drift')) drift = true;
    if (I.isDown('airRoll')) airRoll = true;

    /* gamepad */
    var p = pollPad();
    if (p) {
      I.hasPad = true;
      var ax = p.axes.length > 0 ? M.dead(p.axes[0], dz) : 0;
      var ay = p.axes.length > 1 ? M.dead(p.axes[1], dz) : 0;
      var rx = p.axes.length > 2 ? M.dead(p.axes[2], dz) : 0;
      var trigR = p.buttons[7] ? p.buttons[7].value : 0;
      var trigL = p.buttons[6] ? p.buttons[6].value : 0;
      if (Math.abs(ax) > 0.01 || Math.abs(ay) > 0.01 || trigR > 0.05 || trigL > 0.05) {
        I.lastSource = 'gamepad';
      }
      st += ax;
      // triggers drive; if neither is touched fall back to the stick's Y
      var padTh = trigR - trigL;
      if (Math.abs(padTh) > 0.03) th += padTh; else th += -ay;
      // pitch always comes from the stick
      out.padPitch = ay;
      if (padButton(p, 0)) jump = true;                    // A
      if (padButton(p, 2) || padButton(p, 5)) boost = true; // X or RB
      if (padButton(p, 1) || padButton(p, 4)) { drift = true; airRoll = true; } // B or LB
      if (padEdge(p, 0, 'jump')) I.edges.jump = true;
      if (padEdge(p, 3, 'ballCam')) I.edges.ballCam = true;  // Y
      if (padEdge(p, 9, 'pause')) I.edges.pause = true;      // Start
      if (padEdge(p, 8, 'reset')) I.edges.reset = true;      // Back/Select
      roll += rx;
    } else out.padPitch = undefined;

    /* touch */
    var tt = I.touch;
    if (tt.stick && (tt.stick.id !== null || tt.buttons.boost || tt.buttons.jump || tt.buttons.brake)) {
      I.lastSource = 'touch';
    }
    if (tt.stick) {
      st += tt.stick.x;
      out.touchPitch = tt.stick.y;
    }
    if (tt.buttons.boost) boost = true;
    if (tt.buttons.jump) jump = true;
    if (tt.buttons.drift) drift = true;
    if (tt.buttons.roll) { airRoll = true; drift = true; }
    if (I.autoThrottle && I.lastSource === 'touch') {
      th += tt.buttons.brake ? -1 : 1;
    } else if (tt.buttons.brake) th -= 1;

    /* normalise */
    out.throttle = M.clamp(th, -1, 1);
    out.steer = M.clamp(st * sens, -1, 1);
    out.jump = jump;
    out.boost = boost;
    out.drift = drift;
    out.airRoll = airRoll;

    /* air axes: pitch follows the same stick as throttle, yaw follows steer */
    var pitch;
    if (out.padPitch !== undefined && Math.abs(out.padPitch) > 0.01) pitch = -out.padPitch;
    else if (out.touchPitch !== undefined && Math.abs(out.touchPitch) > 0.01) pitch = -out.touchPitch;
    else pitch = out.throttle;
    // invert lives here and nowhere else, so it can never reach the bots
    out.pitch = M.clamp(pitch, -1, 1) * (RL.save.invertPitch ? -1 : 1);
    out.yaw = out.steer;
    out.roll = M.clamp(roll, -1, 1);
    return out;
  };

  /* one-shot actions */
  I.pressed = function (action) {
    if (I.edges[action]) { I.edges[action] = false; return true; }
    return false;
  };
  I.clearEdges = function () { I.edges = {}; };

  /* rebinding */
  I.beginCapture = function (action, cb) { I.capture = { action: action, cb: cb }; };
  I.cancelCapture = function () { I.capture = null; };

  I.keyLabel = function (code) {
    if (!code) return '—';
    return code
      .replace(/^Key/, '').replace(/^Digit/, '').replace(/^Numpad/, 'Num ')
      .replace(/^Arrow/, '').replace('Left', 'L ').replace('Right', 'R ')
      .replace('Control', 'Ctrl').replace('Shift', 'Shift ').replace('Alt', 'Alt ')
      .replace('Escape', 'Esc').replace('Space', 'Space').trim();
  };

  I.bindLabel = function (action) {
    var list = RL.save.keys[action] || [];
    return list.map(I.keyLabel).join(' / ') || '—';
  };

})(window);

</script>
  <script>
/* ============================================================
   ui.js — menus, HUD and settings.  Plain DOM over the canvas:
   crisp text at any resolution and it costs the renderer nothing.
   ============================================================ */
(function (global) {
  'use strict';
  var RL = global.RL, M = RL.M;

  var U = RL.UI = { screen: 'title', hudOn: false };
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function hex(c) { return '#' + ('000000' + c.toString(16)).slice(-6); }

  function click(node, fn, sound) {
    node.addEventListener('click', function (e) {
      e.preventDefault();
      RL.Audio.unlock();
      RL.Audio.sfxUI(sound || 'tap');
      fn(e);
    });
    return node;
  }

  /* ---------------- screens ---------------- */

  U.show = function (name) {
    U.screen = name;
    var overlay = $('overlay');
    overlay.style.display = name === 'game' ? 'none' : 'flex';
    ['title', 'season', 'exhibition', 'garage', 'settings', 'controls', 'howto', 'pause', 'results']
      .forEach(function (s) {
        var n = $('scr-' + s);
        if (n) n.classList.toggle('on', s === name);
      });
    if (name !== 'game') $('hud').classList.remove('on');
    document.body.classList.toggle('in-game', name === 'game');
  };

  U.showHUD = function (on) {
    U.hudOn = on;
    $('hud').classList.toggle('on', !!on);
    var touch = !!on && RL.isTouch;
    $('touch').classList.toggle('on', touch);
    document.body.classList.toggle('touch-ui', touch);
  };

  /* ---------------- title ---------------- */

  function buildTitle() {
    var s = $('scr-title');
    clear(s);
    var card = el('div', 'card title-card');

    var logo = el('div', 'logo');
    logo.innerHTML = '<span class="l1">ROCKET</span><span class="l2">RUMBLE</span>';
    card.appendChild(logo);
    card.appendChild(el('div', 'sub', "R3's Turbo League"));

    var stars = RL.totalStars();
    card.appendChild(el('div', 'tiny', '★ ' + stars + ' / ' + (RL.LEVELS.length * 3) +
      '   ·   ' + RL.save.totalGoals + ' career goals'));

    var menu = el('div', 'menu');
    menu.appendChild(click(el('button', 'btn primary', 'PLAY SEASON'), function () { buildSeason(); U.show('season'); }, 'big'));
    menu.appendChild(click(el('button', 'btn', 'QUICK MATCH'), function () { buildExhibition(); U.show('exhibition'); }));
    menu.appendChild(click(el('button', 'btn', 'FREE PLAY'), function () {
      RL.Game.start(RL.freePlay(RL.LEVELS[Math.min(RL.save.unlocked, RL.LEVELS.length) - 1].theme));
      U.show('game');
    }));
    menu.appendChild(click(el('button', 'btn', 'GARAGE'), function () { buildGarage(); U.show('garage'); }));
    menu.appendChild(click(el('button', 'btn', 'CONTROLS'), function () { buildControls(); U.show('controls'); }));
    menu.appendChild(click(el('button', 'btn', 'SETTINGS'), function () { buildSettings(); U.show('settings'); }));
    menu.appendChild(click(el('button', 'btn ghost', 'HOW TO PLAY'), function () { buildHowTo(); U.show('howto'); }));
    card.appendChild(menu);

    card.appendChild(el('div', 'foot', 'Built for Roland N. Emokpae III'));
    s.appendChild(card);
  }

  /* ---------------- season ---------------- */

  function starRow(n) {
    var w = el('span', 'stars');
    for (var i = 0; i < 3; i++) {
      var st = el('span', 'star' + (i < n ? ' on' : ''), '★');
      w.appendChild(st);
    }
    return w;
  }

  function buildSeason() {
    var s = $('scr-season');
    clear(s);
    var card = el('div', 'card wide');
    card.appendChild(header('SEASON', function () { buildTitle(); U.show('title'); }));

    var diff = el('div', 'row diffrow');
    diff.appendChild(el('span', 'lbl', 'Difficulty'));
    var seg = el('div', 'seg');
    RL.SKILL_ORDER.forEach(function (k) {
      var b = el('button', 'segbtn' + (RL.save.difficulty === k ? ' on' : ''), RL.SKILLS[k].label);
      click(b, function () {
        RL.save.difficulty = k; RL.persist();
        buildSeason();
      });
      seg.appendChild(b);
    });
    diff.appendChild(seg);
    card.appendChild(diff);

    var list = el('div', 'levels');
    RL.LEVELS.forEach(function (lv) {
      var locked = lv.id > RL.save.unlocked;
      var got = RL.save.stars['L' + lv.id] || 0;
      var item = el('div', 'level' + (locked ? ' locked' : ''));
      var th = RL.THEMES[lv.theme];

      var swatch = el('div', 'swatch');
      swatch.style.background = 'linear-gradient(135deg,' + th.turf[0] + ',' + hex(th.trim) + ')';
      swatch.appendChild(el('span', 'num', locked ? '\u{1F512}' : String(lv.id)));
      item.appendChild(swatch);

      var body = el('div', 'lvbody');
      var t = el('div', 'lvtitle');
      t.appendChild(el('span', 'nm', lv.name));
      t.appendChild(el('span', 'tag', lv.tag));
      body.appendChild(t);
      body.appendChild(el('div', 'lvblurb', locked ? 'Win the previous match to unlock.' : lv.blurb));
      body.appendChild(starRow(got));
      item.appendChild(body);

      if (!locked) {
        click(item, function () {
          RL.Game.start(lv);
          U.show('game');
        }, 'big');
      }
      list.appendChild(item);
    });
    card.appendChild(list);
    s.appendChild(card);
  }

  function header(title, back) {
    var h = el('div', 'hdr');
    h.appendChild(click(el('button', 'back', '‹'), back, 'back'));
    h.appendChild(el('h2', null, title));
    h.appendChild(el('span', 'spacer'));
    return h;
  }

  /* ---------------- exhibition ---------------- */

  var exOpts = { theme: 'neon', teamSize: 1, time: 300, gravity: 1.0, grip: 1.0 };

  function buildExhibition() {
    var s = $('scr-exhibition');
    clear(s);
    var card = el('div', 'card wide');
    card.appendChild(header('QUICK MATCH', function () { buildTitle(); U.show('title'); }));

    card.appendChild(choiceRow('Arena', Object.keys(RL.THEMES).map(function (k) {
      return { v: k, l: RL.THEMES[k].name };
    }), exOpts.theme, function (v) { exOpts.theme = v; buildExhibition(); }));

    card.appendChild(choiceRow('Team size', [
      { v: 1, l: '1 v 1' }, { v: 2, l: '2 v 2' }, { v: 3, l: '3 v 3' }
    ], exOpts.teamSize, function (v) { exOpts.teamSize = v; buildExhibition(); }));

    card.appendChild(choiceRow('Match length', [
      { v: 120, l: '2 min' }, { v: 300, l: '5 min' }, { v: 600, l: '10 min' }, { v: 0, l: 'No limit' }
    ], exOpts.time, function (v) { exOpts.time = v; buildExhibition(); }));

    card.appendChild(choiceRow('Gravity', [
      { v: 0.42, l: 'Low' }, { v: 1.0, l: 'Normal' }, { v: 1.5, l: 'Heavy' }
    ], exOpts.gravity, function (v) { exOpts.gravity = v; buildExhibition(); }));

    card.appendChild(choiceRow('Grip', [
      { v: 0.42, l: 'Ice' }, { v: 1.0, l: 'Normal' }, { v: 1.4, l: 'Sticky' }
    ], exOpts.grip, function (v) { exOpts.grip = v; buildExhibition(); }));

    card.appendChild(choiceRow('Opponents', RL.SKILL_ORDER.map(function (k) {
      return { v: k, l: RL.SKILLS[k].label };
    }), RL.save.difficulty, function (v) { RL.save.difficulty = v; RL.persist(); buildExhibition(); }));

    var go = click(el('button', 'btn primary wide-btn', 'START MATCH'), function () {
      RL.Game.start(RL.exhibition(exOpts));
      U.show('game');
    }, 'big');
    card.appendChild(go);
    s.appendChild(card);
  }

  function choiceRow(label, options, current, onPick) {
    var r = el('div', 'row');
    r.appendChild(el('span', 'lbl', label));
    var seg = el('div', 'seg');
    options.forEach(function (o) {
      var b = el('button', 'segbtn' + (o.v === current ? ' on' : ''), o.l);
      click(b, function () { onPick(o.v); });
      seg.appendChild(b);
    });
    r.appendChild(seg);
    return r;
  }

  /* ---------------- garage ---------------- */

  function buildGarage() {
    var s = $('scr-garage');
    clear(s);
    var card = el('div', 'card wide');
    card.appendChild(header('GARAGE', function () { buildTitle(); U.show('title'); }));

    var grid = el('div', 'bodies');
    RL.BODIES.forEach(function (b, i) {
      var it = el('div', 'bodycard' + (RL.save.carBody === i ? ' on' : ''));
      it.appendChild(el('div', 'bname', b.name));
      it.appendChild(el('div', 'bdesc', b.desc));
      var bars = el('div', 'bars');
      [['SPD', b.speed], ['TRN', b.turn], ['PWR', b.power]].forEach(function (st) {
        var row = el('div', 'bar');
        row.appendChild(el('span', 'bk', st[0]));
        var track = el('span', 'track');
        var fill = el('span', 'fill');
        fill.style.width = Math.round(((st[1] - 0.85) / 0.35) * 100) + '%';
        track.appendChild(fill);
        row.appendChild(track);
        bars.appendChild(row);
      });
      it.appendChild(bars);
      click(it, function () { RL.save.carBody = i; RL.persist(); buildGarage(); });
      grid.appendChild(it);
    });
    card.appendChild(grid);

    card.appendChild(el('div', 'lbl pad', 'Paint'));
    var sw = el('div', 'swatches');
    RL.ACCENTS.forEach(function (a, i) {
      var b = el('button', 'sw' + (RL.save.carColor === i ? ' on' : ''));
      b.style.background = hex(a.c);
      b.title = a.name;
      click(b, function () { RL.save.carColor = i; RL.persist(); buildGarage(); });
      sw.appendChild(b);
    });
    card.appendChild(sw);
    card.appendChild(el('div', 'tiny pad',
      'Your car always wears your team colour in a match — the paint goes on the stripes, wing and wheels.'));
    s.appendChild(card);
  }

  /* ---------------- settings ---------------- */

  function slider(label, value, min, max, step, fmt, onChange) {
    var r = el('div', 'row');
    r.appendChild(el('span', 'lbl', label));
    var wrap = el('div', 'slwrap');
    var input = document.createElement('input');
    input.type = 'range'; input.min = min; input.max = max; input.step = step; input.value = value;
    var out = el('span', 'slval', fmt(value));
    input.addEventListener('input', function () {
      var v = parseFloat(input.value);
      out.textContent = fmt(v);

    r.appendChild(wrap);
    return r;
  }

  function toggle(label, value, onChange) {
    var r = el('div', 'row');
    r.appendChild(el('span', 'lbl', label));
    var b = el('button', 'tgl' + (value ? ' on' : ''), value ? 'ON' : 'OFF');

      value = !value;

  function buildSettings() {
    var s = $('scr-settings');

    card.appendChild(choiceRow('Graphics', [
      { v: 'auto', l: 'Auto' }, { v: 'low', l: 'Low' },
      { v: 'medium', l: 'Medium' }, { v: 'high', l: 'High' }
    ], RL.save.quality, function (v) {
      RL.save.quality = v; RL.persist(); RL.Game.quality = RL.autoQuality(); RL.Game.resize();

    card.appendChild(toggle('Auto-level in the air', RL.save.assistLevel, function (v) {

      'Smooth steering eases the car into a turn instead of snapping to full lock. ' +
      'Auto-level rolls you back onto your wheels when you are not steering in the air — ' +
      'it stops the moment you touch a control.'));

    card.appendChild(toggle('Ball camera by default', RL.save.ballCam, function (v) {

    card.appendChild(toggle('Invert air pitch', RL.save.invertPitch, function (v) {
      RL.save.invertPitch = v; RL.persist();
    }));

    card.appendChild(slider('Camera distance', RL.save.camDist, 6, 15, 0.5,
      function (v) { return v.toFixed(1); }, function (v) { RL.save.camDist = v; RL.persist(); }));
    card.appendChild(slider('Camera height', RL.save.camHeight, 1.5, 6, 0.1,
      function (v) { return v.toFixed(1); }, function (v) { RL.save.camHeight = v; RL.persist(); }));
    card.appendChild(slider('Field of view', RL.save.camFov, 65, 110, 1,
      function (v) { return v + '°'; }, function (v) {
        RL.save.camFov = v; RL.persist(); RL.Game.resize();
      }));
    card.appendChild(slider('Screen shake', RL.save.shake, 0, 1.5, 0.05,
      function (v) { return Math.round(v * 100) + '%'; }, function (v) { RL.save.shake = v; RL.persist(); }));
    card.appendChild(slider('Steering sensitivity', RL.save.steerSens, 0.5, 1.6, 0.05,
      function (v) { return v.toFixed(2); }, function (v) { RL.save.steerSens = v; RL.persist(); }));
    card.appendChild(slider('Air control sensitivity', RL.save.airSens, 0.5, 1.6, 0.05,
      function (v) { return v.toFixed(2); }, function (v) { RL.save.airSens = v; RL.persist(); }));
    card.appendChild(slider('Controller deadzone', RL.save.deadzone, 0.02, 0.4, 0.01,
      function (v) { return Math.round(v * 100) + '%'; }, function (v) { RL.save.deadzone = v; RL.persist(); }));

    card.appendChild(slider('Sound effects', RL.save.sfxVol, 0, 1, 0.05,

      function (v) { RL.save.sfxVol = v; RL.Audio.setVolumes(); RL.persist(); }));
    card.appendChild(slider('Music', RL.save.musicVol, 0, 1, 0.05,

      function (v) { RL.save.musicVol = v; RL.Audio.setVolumes(); RL.persist(); }));

    if (RL.isTouch) {
      card.appendChild(toggle('Auto-accelerate (touch)', RL.Input.autoThrottle, function (v) {
        RL.Input.autoThrottle = v;
      }));
      card.appendChild(choiceRow('Stick side', [
        { v: 'left', l: 'Left' }, { v: 'right', l: 'Right' }
      ], RL.save.touchLayout, function (v) {
        RL.save.touchLayout = v; RL.persist();
        $('touch').classList.toggle('mirrored', v === 'right');
        buildSettings();
      }));
    }

  /* ---------------- controls ---------------- */

  function buildControls() {
    var s = $('scr-controls');
    clear(s);
    var card = el('div', 'card wide');
    card.appendChild(header('CONTROLS', function () { buildTitle(); U.show('title'); }));

    card.appendChild(el('div', 'tiny pad',
      'Click a key to change it, then press the key you want. Esc cancels.'));

      var action = pair[0], label = pair[1];

      row.appendChild(el('span', 'bl', label));

          b.classList.remove('listening');

  /* ---------------- how to play ---------------- */

  function buildHowTo() {
    var s = $('scr-howto');
    clear(s);
    var card = el('div', 'card wide');
    card.appendChild(header('HOW TO PLAY', function () { buildTitle(); U.show('title'); }));
    var tips = [
      ['It is football, with cars.', 'Knock the giant ball into the other team’s net. Most goals when the clock runs out wins. A draw goes to overtime — next goal takes it.'],
      ['Boost is everything.', 'The yellow pads refill your boost. The big glowing ones give you a full tank. Boost makes you fast enough to demolish opponents — and fast enough to fly.'],
      ['Jump twice to flip.', 'Tap jump, then tap it again while holding a direction. Flipping forward is the hardest shot in the game. Flipping sideways is how you dodge.'],
      ['Yes, you can drive on the walls.', 'Hit a wall with enough speed and you’ll stick to it. The curved corners are ramps — use them to get up high.'],
      ['Aerials win matches.', 'Jump, then point your nose at the ball and hold boost. Steer in the air with the same stick you steer with on the ground.'],
      ['Powerslide round corners.', 'Hold the powerslide key and steer. You keep your speed instead of scrubbing it off.'],

    s.appendChild(card);

  /* ---------------- pause ---------------- */

  U.openPause = function () {
    var s = $('scr-pause');
    clear(s);
    var card = el('div', 'card');
    card.appendChild(el('h2', null, 'PAUSED'));

    U.show('pause');

  U.matchOver = function (won, score, stars, stats, level) {

      RL.Game.quit(); buildTitle(); U.show('title');

    card.appendChild(menu);
    s.appendChild(card);
    U.show('results');
    U.showHUD(false);

  /* ---------------- HUD ---------------- */

  var bigTimer = 0, toastTimer = 0, flashTimer = 0, bannerTimer = 0;

  U.bigText = function (txt, dur) {
    var n = $('bigtext');
    n.textContent = txt;
    n.classList.remove('pop');

    var n = $('toast');
    n.textContent = txt;
    n.classList.remove('pop');
    void n.offsetWidth;
    n.classList.add('pop');

  };

  U.flash = function (color) {
    var n = $('flash');
    n.style.background = hex(color);
    n.style.opacity = '0.55';
    flashTimer = 0.5;
  };

  U.goalBanner = function (teamName, color, scorer, byPlayer) {
    var n = $('banner');
    clear(n);
    var t = el('div', 'bteam', teamName + ' SCORES');

    n.appendChild(t);
    if (scorer) n.appendChild(el('div', 'bwho', byPlayer ? 'YOU!' : scorer));
    n.classList.add('on');
    bannerTimer = 3.0;
  };

  U.tickHUD = function (dt) {
    var G = RL.Game;

    if (bigTimer > 0) { bigTimer -= dt; if (bigTimer <= 0) $('bigtext').textContent = ''; }
    if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $('toast').textContent = ''; }
    if (flashTimer > 0) {
      flashTimer -= dt;
      $('flash').style.opacity = String(Math.max(0, flashTimer / 0.5) * 0.55);
    }
    if (bannerTimer > 0) { bannerTimer -= dt; if (bannerTimer <= 0) $('banner').classList.remove('on'); }

    if (!U.hudOn || !G.player) return;

    $('sc0').textContent = G.score[0];
    $('sc1').textContent = G.score[1];

    var t = Math.max(0, G.clock);
    var mm = Math.floor(t / 60), ss = Math.floor(t % 60);
    var clockEl = $('clock');
    if (G.overtime) { clockEl.textContent = '+OT'; clockEl.classList.add('ot'); }
    else if (G.level && G.level.time === 0) { clockEl.textContent = '∞'; clockEl.classList.remove('ot'); }
    else {
      clockEl.textContent = mm + ':' + (ss < 10 ? '0' : '') + ss;
      clockEl.classList.toggle('ot', t < 30);
    }

    var b = Math.round(G.player.boost);
    $('boostNum').textContent = b;
    $('boostFill').style.width = b + '%';
    $('boostRing').classList.toggle('full', b >= 99);

    var kph = Math.round(G.player.speed * 3.1);
    $('speed').textContent = kph;
    $('speedo').classList.toggle('sonic', G.player.supersonic);

    var ind = $('ballcam');
    ind.classList.toggle('on', RL.save.ballCam);
  };

  /* ---------------- boot ---------------- */

  U.init = function () {
    buildTitle();
    U.show('title');

    // any first tap unlocks the audio context
    var unlock = function () {
      RL.Audio.unlock();
      RL.Audio.playMusic('menu');
      global.removeEventListener('pointerdown', unlock);
      global.removeEventListener('keydown', unlock);
    };
    global.addEventListener('pointerdown', unlock);
    global.addEventListener('keydown', unlock);

    // Esc / P from a submenu goes back sensibly
    global.addEventListener('keydown', function (e) {
      if (e.code !== 'Escape') return;
      if (RL.Input.capture) return;
      var s = U.screen;
      if (s === 'season' || s === 'exhibition' || s === 'garage' || s === 'howto') {
        buildTitle(); U.show('title');
      } else if (s === 'settings' || s === 'controls') {
        var from = $('scr-' + s).dataset.from;
        $('scr-' + s).dataset.from = '';
        if (from === 'pause') U.openPause();
        else { buildTitle(); U.show('title'); }
      }
    });

    $('btnPause').addEventListener('click', function () { RL.Game.pause(); });
    $('btnCam').addEventListener('click', function () {
      RL.save.ballCam = !RL.save.ballCam; RL.persist(); RL.Audio.sfxUI();
    });
  };

  U.buildTitle = buildTitle;

      }

    }
    if (RL.Input.pressed('reset') && G.player && G.state === 'play') {
      // drop back onto your own half, wheels down, facing the ball
      var rz = M.clamp(G.player.pos.z, -A.hz + 8, -6);
      var head = Math.atan2(G.ball.pos.x - G.player.pos.x * 0.6, G.ball.pos.z - rz);
      G.player.reset(M.clamp(G.player.pos.x, -A.hx + 6, A.hx - 6), C.ride, rz, head);
      G.player.boost = Math.max(G.player.boost, 12);
    }

    /* --- bots + cars ---
       Everyone is frozen on the line through the countdown, same as the
       real game: nobody gets a rolling start and nobody can reach the
       (non-collidable) frozen ball early. */
    var live = G.state !== 'countdown';
    // the kickoff routine budget only burns once the whistle has gone
    if (live) G.kickoffTimer = Math.max(0, (G.kickoffTimer || 0) - dt);

    for (var b = 0; b < G.bots.length; b++) {
      if (live) G.bots[b].update(sim);
      else {
        var bi = G.bots[b].car.input;
        bi.throttle = 0; bi.steer = 0; bi.jump = false; bi.boost = false;
        bi.drift = false; bi.pitch = 0; bi.yaw = 0; bi.roll = 0;
      }
    }
    if (!live) { G.finishFrame(dt); return; }

    for (var i = 0; i < G.cars.length; i++) {
      var car = G.cars[i];
      car.update(sim, G.world);
      if (G.fx) { G.fx.boostTrail(car, sim); G.fx.driftSmoke(car, sim); }
      if (car === G.player) {
        if (car.speed > G.stats.topSpeed) G.stats.topSpeed = car.speed;
      }
    }

    /* --- ball --- */
    var ballWasHeadingHome = threatToPlayer();
    G.ball.update(sim, G.world);
    for (var j = 0; j < G.cars.length; j++) {
      var hit = G.ball.collideCar(G.cars[j], sim);
      if (hit > 1.0 && G.cars[j] === G.player) {
        if (ballWasHeadingHome && !threatToPlayer()) {
          G.stats.saves++;
          RL.Audio.sfxSave();
          RL.UI.toast('SAVE!');
          if (G.arena) G.arena.cheer(0.6);
        }
      }
    }

    /* --- demolitions --- */
    G.checkDemos();

    /* --- goals --- */
    if (G.state === 'play' && !G.ball.frozen) {
      var net = RL.inNet(G.ball.pos);
      if (net !== 0) G.scoreGoal(net > 0 ? 0 : 1);
    }

    /* --- world --- */
    G.finishFrame(dt);
  };

  /* everything that runs whether or not the sim is live */
  G.finishFrame = function (dt) {
    if (G.arena) G.arena.update(dt, G.camera);
    if (G.fx) G.fx.update(dt);
    G.updateMarker();
    G.updateCamera(dt);
    G.updateAudio();
    RL.UI.tickHUD(dt);
  };

  function threatToPlayer() {
    // is the ball currently on a path into the player's own net?
    var b = G.ball;
    if (b.vel.z > -6) return false;              // team 0 defends -Z
    var t = (-A.hz - b.pos.z) / b.vel.z;
    if (t < 0 || t > 2.2) return false;
    var x = b.pos.x + b.vel.x * t;
    var y = b.pos.y + b.vel.y * t - 0.5 * BL.gravity * G.world.gravity * t * t;
    return Math.abs(x) < A.goalW + 1.2 && y > 0 && y < A.goalH + 1;
  }

  G.checkDemos = function () {
    for (var i = 0; i < G.cars.length; i++) {
      var a = G.cars[i];
      if (a.demoed > 0 || !a.supersonic) continue;
      for (var j = 0; j < G.cars.length; j++) {
        var b = G.cars[j];
        if (b === a || b.team === a.team || b.demoed > 0) continue;
        if (a.pos.distanceToSquared(b.pos) < C.demoRadius * C.demoRadius) {
          // the faster car wins the exchange
          if (b.supersonic && b.speed > a.speed) continue;
          if (b.demolish()) {
            RL.Audio.sfxDemo();
            if (G.fx) G.fx.demoBurst(b.pos, b.teamColor);
            if (a === G.player) { G.stats.demos++; RL.UI.toast('DEMOLISHED!'); }
            else if (b === G.player) RL.UI.toast('WRECKED!');
          }
        }
      }
    }
  };

  G.scoreGoal = function (team) {
    G.score[team]++;
    G.state = 'goal';
    G.goalTimer = 3.4;
    G.ball.frozen = true;
    G.ball.vel.set(0, 0, 0);

    var color = TEAM_COLORS[team];
    if (G.fx) G.fx.goalExplosion(G.ball.pos, color);
    if (G.arena) { G.arena.flashGoal(team === 0 ? 1 : -1); G.arena.cheer(1.0); }
    RL.Audio.sfxGoal(team === 0);

    var scorer = G.ball.lastToucher;
    var byPlayer = scorer === G.player;
    if (byPlayer) { G.stats.goals++; RL.save.totalGoals++; RL.persist(); }

    var ownGoal = scorer && scorer.team !== team;
    RL.UI.goalBanner(
      TEAM_NAMES[team],
      color,
      ownGoal ? 'OWN GOAL' : (scorer ? scorer.name : ''),
      byPlayer
    );
    RL.UI.flash(color);
    G.ball.mesh.visible = false;
    G.ball.glow.visible = false;
    setTimeout(function () {
      if (G.ball) { G.ball.mesh.visible = true; G.ball.glow.visible = true; }
    }, 1400);
  };

  G.startOvertime = function () {
    if (G.overtime) return;
    G.overtime = true;
    G.clock = 0;
    RL.UI.bigText('OVERTIME', 1.6);
    RL.Audio.sfxWhistle();
    RL.Audio.playMusic('tense');
  };

  G.checkMatchEnd = function () {
    if (G.overtime) { G.finish(); return true; }
    if (G.level.time > 0 && G.clock <= 0) {
      if (G.score[0] === G.score[1]) { G.startOvertime(); return false; }
      G.finish(); return true;
    }
    return false;
  };

  G.finish = function () {
    G.state = 'over';
    G.ball.frozen = true;
    RL.Audio.sfxWhistle();
    var won = G.score[0] > G.score[1];
    var lvl = G.level;

    if (won) {
      RL.Audio.sfxWin();
      if (G.fx) G.fx.confetti([0x3da5ff, 0xffffff, 0xffd24a, 0x6effc4]);
      if (G.arena) G.arena.cheer(1.0);
      RL.save.totalWins++;
    } else RL.Audio.sfxLose();

    var stars = 0;
    if (!lvl.freePlay && !lvl.exhibition) {
      stars = RL.starsFor(G.score[0], G.score[1]);
      var key = 'L' + lvl.id;
      if ((RL.save.stars[key] || 0) < stars) RL.save.stars[key] = stars;
      if (won && RL.save.unlocked < lvl.id + 1 && lvl.id < RL.LEVELS.length) {
        RL.save.unlocked = lvl.id + 1;
      }
    }
    RL.persist();
    RL.Audio.stopMusic();
    RL.UI.matchOver(won, G.score.slice(), stars, G.stats, lvl);
  };

  /* ---------------- landing marker ---------------- */

  G.updateMarker = function () {
    var b = G.ball, m = b.marker;
    if (!m) return;
    if (b.frozen || b.pos.y < BL.radius + 0.6) { m.material.opacity = 0; return; }
    var found = -1;
    for (var i = 2; i < G.predN; i++) {
      if (G.pred[i * 3 + 1] <= BL.radius + 0.25) { found = i; break; }
    }
    if (found < 0) { m.material.opacity = 0; return; }
    var t = found * G.predDt;
    m.position.set(G.pred[found * 3], 0.08, G.pred[found * 3 + 2]);
    var s = BL.radius * 3.4;
    m.scale.set(s, s, 1);
    m.material.opacity = M.clamp(0.75 - t * 0.16, 0.08, 0.75);
    m.material.color.setHSL(0.55 - M.clamp(1 - t / 3, 0, 1) * 0.5, 1, 0.6);
  };

  /* ---------------- camera ---------------- */

  G.updateCamera = function (dt) {
    var cam = G.camera;
    var car = G.player;
    if (!car) return;

    /* Goal replay cam: pull back and frame the net. Keeping the chase cam
       glued to the car during a celebration buries it in the end wall. */
    if (G.state === 'goal' && G.ball) {
      var gside = M.sign(G.ball.pos.z) || 1;
      _camWant.set(G.ball.pos.x * 0.45, 9.0, G.ball.pos.z - gside * 24);
      var gsd = RL.surfaceDist(_camWant);
      if (gsd < 2.4) { RL.surfaceNormal(_camWant, _v2); _camWant.addScaledVector(_v2, 2.4 - gsd); }
      cam.position.lerp(_camWant, 1 - Math.exp(-4.5 * dt));
      _look.copy(G.ball.pos); _look.y += 1.0;
      _lookNow.lerp(_look, 1 - Math.exp(-6 * dt));
      if (G.fx && G.fx.shake > 0.001) {
        var gs = G.fx.shake * G.fx.shake * 0.9;
        cam.position.x += (Math.random() - 0.5) * gs;
        cam.position.y += (Math.random() - 0.5) * gs;
      }
      cam.lookAt(_lookNow);
      G.camSnap = true;      // snap back cleanly when play resumes
      return;
    }

    var ballCam = RL.save.ballCam;
    var dist = RL.save.camDist, height = RL.save.camHeight;

    // which way should we be looking?
    if (ballCam && G.ball) {
      _v.copy(G.ball.pos).sub(car.pos);
      _v.y = 0;
      if (_v.lengthSq() < 4) car.forward(_v).setY(0);
    } else {
      car.forward(_v); _v.y = 0;
      if (_v.lengthSq() < 0.01) _v.set(0, 0, 1);
    }
    if (_v.lengthSq() < 1e-4) _v.set(0, 0, 1);
    _v.normalize();

    var snap = G.camSnap ? 1 : (1 - Math.exp(-(ballCam ? 6.5 : 9.0) * dt));
    _camDir.lerp(_v, snap).normalize();

    // pull back and up from the car
    var speedT = M.clamp(car.speed / C.maxSpeed, 0, 1);
    var d = dist + speedT * 1.9;
    var h = height + speedT * 0.5;
    _camWant.copy(car.pos).addScaledVector(_camDir, -d);
    _camWant.y += h;
    // when the car is on a wall or ceiling, lift the camera off that surface too
    car.upVec(_v2);
    if (_v2.y < 0.75) _camWant.addScaledVector(_v2, h * 0.55);

    // keep well clear of the walls — get too close and the crowd band and
    // panelling alias into a moiré mess
    var sd = RL.surfaceDist(_camWant);
    if (sd < 2.4) {
      RL.surfaceNormal(_camWant, _v2);
      _camWant.addScaledVector(_v2, 2.4 - sd);
    }

    if (G.camSnap) cam.position.copy(_camWant);
    else cam.position.lerp(_camWant, 1 - Math.exp(-11 * dt));

    // look at a point between the car and the ball
    if (ballCam && G.ball) {
      _look.copy(car.pos).lerp(G.ball.pos, 0.42);
      _look.y += 1.1;
    } else {
      _look.copy(car.pos).addScaledVector(_camDir, 9);
      _look.y += 1.6;
    }
    if (G.camSnap) _lookNow.copy(_look);
    else _lookNow.lerp(_look, 1 - Math.exp(-13 * dt));

    // shake
    if (G.fx && G.fx.shake > 0.001) {
      var s = G.fx.shake * G.fx.shake * 0.9;
      cam.position.x += (Math.random() - 0.5) * s;
      cam.position.y += (Math.random() - 0.5) * s;
      cam.position.z += (Math.random() - 0.5) * s;
    }
    cam.lookAt(_lookNow);

    // FOV kick with speed
    var baseFov = RL.save.camFov + (cam.aspect < 1 ? 16 : 0);
    var wantFov = baseFov + speedT * 7 + (car.supersonic ? 4 : 0);
    if (Math.abs(cam.fov - wantFov) > 0.05) {
      cam.fov = M.damp(cam.fov, wantFov, 6, dt);
      cam.updateProjectionMatrix();
    }
    G.camSnap = false;
  };

  /* ---------------- audio glue ---------------- */

  G.updateAudio = function () {
    var car = G.player;
    if (!car) return;
    RL.Audio.engine(
      M.clamp(car.speed / C.maxSpeed, 0, 1),
      Math.abs(car.input.throttle),
      car.boosting,
      !car.onGround
    );
  };

  /* ---------------- helpers used by the UI ---------------- */

  G.teamColor = function (t) { return TEAM_COLORS[t]; };
  G.teamName = function (t) { return TEAM_NAMES[t]; };

})(window);

</script>
  <script>
/* ============================================================
   main.js — boot.
   ============================================================ */
(function (global) {
  'use strict';
  var RL = global.RL;

  function boot() {
    if (!global.THREE) {
      document.body.innerHTML =
        '<div style="color:#fff;font:16px system-ui;padding:40px">' +
        'Could not load the 3D engine. Try refreshing the page.</div>';
      return;
    }

    var canvas = document.getElementById('gl');

    // WebGL missing (very old device, or blocked) — say so instead of hanging
    try {
      RL.Game.init(canvas);
    } catch (e) {
      console.error(e);
      document.getElementById('overlay').innerHTML =
        '<div class="screen on"><div class="card"><h2>No 3D support</h2>' +
        '<p style="opacity:.8;line-height:1.6">This device or browser can\'t run WebGL. ' +
        'Try Chrome or Safari, or turn on hardware acceleration in your browser settings.</p></div></div>';
      return;
    }

    RL.Input.init();
    RL.UI.init();

    if (RL.save.touchLayout === 'right') {
      document.getElementById('touch').classList.add('mirrored');
    }

    // stop iOS double-tap zoom and long-press menus over the play area
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('contextmenu', function (e) {
      if (e.target.closest('#touch') || e.target.id === 'gl') e.preventDefault();
    });

    // pause automatically if the tab or app goes away mid-match
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && RL.Game.state !== 'menu' && RL.Game.state !== 'paused' &&
        RL.Game.running) {
        RL.Game.pause();
      }
    });

    // portrait nag on phones only
    function checkRotate() {
      var need = RL.isMobile && global.innerHeight > global.innerWidth * 1.15;
      document.getElementById('rotate').classList.toggle('on', need);
    }
    global.addEventListener('resize', checkRotate);
    global.addEventListener('orientationchange', function () { setTimeout(checkRotate, 200); });
    checkRotate();

    /* Deep links, also handy for attract-mode screenshots:
         ?level=3        jump straight into season level 3
         ?arena=neon     free play in a named arena
         ?demo=1         hand the player's car to a bot and just watch
         ?touch=1        force the on-screen controls on (touchscreen laptops
                         that don't report themselves as touch devices)      */
    var q = new URLSearchParams(location.search);
    if (q.get('touch') === '1') {
      RL.isTouch = true;
      RL.Input.autoThrottle = true;
    }
    if (q.has('level') || q.has('arena') || q.has('demo')) {
      var lvl;
      if (q.has('level')) {
        lvl = RL.LEVELS[Math.max(1, Math.min(RL.LEVELS.length, parseInt(q.get('level'), 10) || 1)) - 1];
      } else {
        lvl = RL.exhibition({ theme: q.get('arena') || 'neon', teamSize: 2, time: 0 });
      }
      RL.Game.start(lvl);
      RL.UI.show('game');
      if (q.get('demo') === '1' && RL.Game.player) {
        RL.Game.bots.push(new RL.Bot(RL.Game, RL.Game.player, 'allstar', 7));
        RL.Game.player.isSpectated = true;
      }
    }

    // service worker: only over https, so a local dev server never fights the cache
    if (false && 'serviceWorker' in navigator && location.protocol === 'https:') {
      global.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { });
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else boot();

})(window);

</script>
