/* ============================================================
   Rocket Rumble — R3's Turbo League
   ============================================================ */

:root {
  --blue: #3da5ff;
  --orange: #ff6b3d;
  --gold: #ffd24a;
  --ink: #05070f;
  --panel: rgba(11, 16, 32, .90);
  --panel2: rgba(20, 28, 52, .72);
  --line: rgba(120, 170, 255, .22);
  --text: #e8f0ff;
  --dim: #93a6c8;
  --safeT: env(safe-area-inset-top, 0px);
  --safeB: env(safe-area-inset-bottom, 0px);
  --safeL: env(safe-area-inset-left, 0px);
  --safeR: env(safe-area-inset-right, 0px);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--ink);
  color: var(--text);
  font-family: "Segoe UI", Roboto, "Helvetica Neue", system-ui, -apple-system, sans-serif;
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#gl {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

/* ============ overlay + cards ============ */

#overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 40;
  padding: calc(12px + var(--safeT)) calc(12px + var(--safeR)) calc(12px + var(--safeB)) calc(12px + var(--safeL));
  background:
    radial-gradient(ellipse at 50% 0%, rgba(61, 165, 255, .14), transparent 62%),
    radial-gradient(ellipse at 50% 100%, rgba(255, 107, 61, .12), transparent 60%),
    linear-gradient(180deg, rgba(3, 5, 12, .90), rgba(3, 5, 12, .96));
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}

.screen {
  display: none;
  width: 100%;
  height: 100%;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

.screen.on {
  display: flex;
}

.card {
  width: min(460px, 100%);
  max-height: 100%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 24px 70px rgba(0, 0, 0, .65), inset 0 1px 0 rgba(255, 255, 255, .06);
  text-align: center;
  margin: auto;
}

.card.wide {
  width: min(700px, 100%);
  text-align: left;
}

.card h2 {
  margin: 0;
  font-size: 20px;
  letter-spacing: .16em;
  font-weight: 800;
}

/* ---- title ---- */

.logo {
  line-height: .88;
  margin: 4px 0 2px;
}

.logo .l1,
.logo .l2 {
  display: block;
  font-weight: 900;
  letter-spacing: .04em;
}

.logo .l1 {
  font-size: clamp(34px, 10vw, 52px);
  color: #fff;
  text-shadow: 0 0 26px rgba(61, 165, 255, .8);
}

.logo .l2 {
  font-size: clamp(40px, 12vw, 64px);
  background: linear-gradient(180deg, #ffd24a, #ff6b3d 70%, #ff2d78);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 22px rgba(255, 140, 60, .55));
}

.sub {
  color: var(--dim);
  letter-spacing: .30em;
  font-size: 12px;
  text-transform: uppercase;
  margin: 10px 0 6px;
}

.tiny {
  color: var(--dim);
  font-size: 12px;
  line-height: 1.6;
}

.tiny.pad {
  margin: 10px 0;
}

.foot {
  margin-top: 16px;
  font-size: 11px;
  color: #5f6f8f;
  letter-spacing: .12em;
}

.menu {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-top: 18px;
}

.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(40, 58, 98, .75), rgba(20, 30, 56, .75));
  color: var(--text);
  font: 700 14px/1 inherit;
  letter-spacing: .14em;
  padding: 15px 16px;
  border-radius: 13px;
  cursor: pointer;
  transition: transform .09s ease, filter .15s ease, box-shadow .15s ease;
}

.btn:hover {
  filter: brightness(1.22);
}

.btn:active {
  transform: scale(.975);
}

.btn.primary {
  background: linear-gradient(180deg, #4db2ff, #1f6fd0);
  border-color: rgba(160, 215, 255, .55);
  color: #04121f;
  box-shadow: 0 8px 26px rgba(45, 140, 240, .40);
}

.btn.ghost {
  background: transparent;
  color: var(--dim);
}

.btn.danger {
  color: #ff7b7b;
  border-color: rgba(255, 100, 100, .3);
}

.wide-btn {
  width: 100%;
  margin-top: 16px;
}

/* ---- headers ---- */

.hdr {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.hdr h2 {
  flex: 1;
  text-align: center;
}

.hdr .spacer {
  width: 40px;
}

.back {
  width: 40px;
  height: 40px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .05);
  color: var(--text);
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  padding: 0 0 3px;
}

.back:active {
  transform: scale(.94);
}

/* ---- rows / segments / sliders ---- */

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid rgba(120, 170, 255, .08);
  flex-wrap: wrap;
}

.lbl {
  flex: 1 1 130px;
  font-size: 13px;
  color: var(--dim);
  letter-spacing: .05em;
}

.lbl.pad {
  display: block;
  margin: 16px 0 8px;
  flex: none;
}

.seg {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.segbtn {
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .045);
  color: var(--dim);
  font: 700 11px/1 inherit;
  letter-spacing: .08em;
  padding: 9px 11px;
  border-radius: 9px;
  cursor: pointer;
}

.segbtn.on {
  background: linear-gradient(180deg, #4db2ff, #2277d4);
  color: #04121f;
  border-color: rgba(160, 215, 255, .6);
}

.tgl {
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .05);
  color: var(--dim);
  font: 800 11px/1 inherit;
  letter-spacing: .1em;
  padding: 10px 16px;
  border-radius: 9px;
  cursor: pointer;
  min-width: 62px;
}

.tgl.on {
  background: linear-gradient(180deg, #57e08a, #23a75c);
  color: #04160c;
  border-color: rgba(140, 255, 190, .5);
}

.slwrap {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1 1 190px;
}

.slwrap input[type=range] {
  flex: 1;
  accent-color: #4db2ff;
  height: 22px;
}

.slval {
  width: 54px;
  text-align: right;
  font-size: 12px;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

/* ---- levels ---- */

.diffrow {
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
  margin-bottom: 8px;
}

.levels {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-top: 6px;
}

.level {
  display: flex;
  gap: 13px;
  align-items: center;
  padding: 11px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--panel2);
  cursor: pointer;
  transition: transform .1s ease, border-color .15s ease;
}

.level:not(.locked):hover {
  border-color: rgba(160, 215, 255, .55);
  transform: translateX(3px);
}

.level.locked {
  opacity: .42;
  cursor: default;
}

.swatch {
  width: 58px;
  height: 58px;
  border-radius: 12px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16);
}

.swatch .num {
  font-weight: 900;
  font-size: 22px;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0, 0, 0, .7);
}

.lvbody {
  flex: 1;
  min-width: 0;
}

.lvtitle {
  display: flex;
  align-items: baseline;
  gap: 9px;
  flex-wrap: wrap;
}

.lvtitle .nm {
  font-weight: 800;
  font-size: 15px;
}

.lvtitle .tag {
  font-size: 10px;
  letter-spacing: .12em;
  color: var(--gold);
  border: 1px solid rgba(255, 210, 74, .35);
  padding: 2px 7px;
  border-radius: 6px;
}

.lvblurb {
  font-size: 12px;
  color: var(--dim);
  line-height: 1.5;
  margin: 4px 0 5px;
}

.stars .star {
  color: #38445e;
  font-size: 14px;
  margin-right: 2px;
}

.stars .star.on {
  color: var(--gold);
  text-shadow: 0 0 12px rgba(255, 210, 74, .8);
}

.stars.big {
  display: block;
  margin: 10px 0;
}

.stars.big .star {
  font-size: 34px;
  margin: 0 4px;
}

/* ---- garage ---- */

.bodies {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
}

.bodycard {
  border: 1px solid var(--line);
  background: var(--panel2);
  border-radius: 13px;
  padding: 12px;
  cursor: pointer;
}

.bodycard.on {
  border-color: var(--gold);
  box-shadow: 0 0 0 1px var(--gold) inset, 0 8px 24px rgba(255, 210, 74, .16);
}

.bname {
  font-weight: 800;
  letter-spacing: .1em;
}

.bdesc {
  font-size: 11px;
  color: var(--dim);
  margin: 3px 0 9px;
}

.bar {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 4px 0;
}

.bk {
  font-size: 9px;
  color: var(--dim);
  width: 26px;
  letter-spacing: .08em;
}

.track {
  flex: 1;
  height: 5px;
  background: rgba(255, 255, 255, .09);
  border-radius: 3px;
  overflow: hidden;
}

.fill {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #4db2ff, #ffd24a);
}

.swatches {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}

.sw {
  width: 40px;
  height: 40px;
  border-radius: 11px;
  border: 2px solid transparent;
  cursor: pointer;
}

.sw.on {
  border-color: #fff;
  box-shadow: 0 0 16px rgba(255, 255, 255, .55);
}

/* ---- controls ---- */

.binds {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 7px;
  margin: 10px 0 16px;
}

.bindrow {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: 10px;
  background: var(--panel2);
  border: 1px solid rgba(120, 170, 255, .1);
}

.bl {
  flex: 1;
  font-size: 13px;
  color: var(--dim);
}

.keycap {
  min-width: 96px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  border-bottom-width: 3px;
  background: rgba(255, 255, 255, .07);
  color: var(--text);
  font: 700 11px/1 inherit;
  letter-spacing: .06em;
  cursor: pointer;
}

.keycap.listening {
  background: var(--gold);
  color: #1a1200;
  border-color: #fff;
  animation: blink .8s infinite;
}

@keyframes blink {

  0%,
  100% {
    filter: brightness(1);
  }

  50% {
    filter: brightness(.7);
  }
}

.padinfo h3 {
  font-size: 13px;
  letter-spacing: .12em;
  margin: 18px 0 5px;
  color: var(--gold);
}

.padinfo p {
  font-size: 12.5px;
  line-height: 1.65;
  color: var(--dim);
  margin: 0;
}

/* ---- how to ---- */

.tips .tip {
  padding: 11px 0;
  border-bottom: 1px solid rgba(120, 170, 255, .1);
}

.tips h3 {
  margin: 0 0 5px;
  font-size: 14px;
  color: #fff;
}

.tips p {
  margin: 0;
  font-size: 13px;
  line-height: 1.65;
  color: var(--dim);
}

/* ---- results ---- */

.verdict {
  font-size: clamp(30px, 9vw, 44px);
  font-weight: 900;
  letter-spacing: .1em;
}

.verdict.win {
  color: var(--gold);
  text-shadow: 0 0 34px rgba(255, 210, 74, .75);
}

.verdict.lose {
  color: #7d8db0;
}

.bigscore {
  font-size: 44px;
  font-weight: 900;
  margin: 4px 0;
  font-variant-numeric: tabular-nums;
}

.champ {
  color: var(--gold);
  font-weight: 800;
  letter-spacing: .1em;
  margin: 10px 0;
}

.unlock {
  color: #6effc4;
  font-size: 12px;
  letter-spacing: .12em;
  margin: 8px 0;
}

.statgrid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  margin: 16px 0 4px;
}

.stat {
  background: var(--panel2);
  border: 1px solid rgba(120, 170, 255, .1);
  border-radius: 11px;
  padding: 10px 4px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.stat .sv {
  font-size: 18px;
  font-weight: 800;
}

.stat .sk {
  font-size: 9px;
  color: var(--dim);
  letter-spacing: .08em;
  text-transform: uppercase;
}

/* ============ HUD ============ */

#hud {
  position: fixed;
  inset: 0;
  z-index: 20;
  pointer-events: none;
  opacity: 0;
  transition: opacity .3s ease;
  font-variant-numeric: tabular-nums;
}

#hud.on {
  opacity: 1;
}

#scorebar {
  position: absolute;
  top: calc(8px + var(--safeT));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: stretch;
  gap: 2px;
  background: rgba(6, 10, 22, .70);
  border: 1px solid var(--line);
  border-radius: 13px;
  overflow: hidden;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

#scorebar .team {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 14px;
}

#scorebar .t0 {
  background: linear-gradient(90deg, rgba(61, 165, 255, .30), transparent);
}

#scorebar .t1 {
  background: linear-gradient(270deg, rgba(255, 107, 61, .30), transparent);
}

#scorebar .tname {
  font-size: 9.5px;
  letter-spacing: .16em;
  color: var(--dim);
  font-weight: 700;
}

#scorebar .sc {
  font-size: 24px;
  font-weight: 900;
  min-width: 20px;
  text-align: center;
}

#scorebar .t0 .sc {
  color: var(--blue);
}

#scorebar .t1 .sc {
  color: var(--orange);
}

#clock {
  display: flex;
  align-items: center;
  padding: 0 14px;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: .04em;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}

#clock.ot {
  color: #ff5b6e;
  animation: pulse 1s infinite;
}

@keyframes pulse {

  0%,
  100% {
    opacity: 1;
  }

  50% {
    opacity: .45;
  }
}

#hudTop {
  position: absolute;
  top: calc(8px + var(--safeT));
  left: calc(10px + var(--safeL));
  display: flex;
  gap: 7px;
  align-items: center;
  pointer-events: auto;
}

.hudbtn {
  width: 40px;
  height: 40px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: rgba(6, 10, 22, .70);
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.hudbtn:active {
  transform: scale(.93);
}

.pill {
  font-size: 9px;
  letter-spacing: .14em;
  padding: 5px 9px;
  border-radius: 7px;
  border: 1px solid var(--line);
  color: #47597a;
  background: rgba(6, 10, 22, .5);
}

.pill.on {
  color: var(--gold);
  border-color: rgba(255, 210, 74, .5);
}

#boostRing {
  position: absolute;
  right: calc(16px + var(--safeR));
  bottom: calc(16px + var(--safeB));
  width: 108px;
  text-align: center;
}

#boostRing svg {
  display: none;
}

#boostNum {
  font-size: 34px;
  font-weight: 900;
  line-height: 1;
  color: var(--gold);
  text-shadow: 0 0 18px rgba(255, 210, 74, .55);
}

#boostBar {
  height: 7px;
  margin: 6px 0 4px;
  background: rgba(255, 255, 255, .12);
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid rgba(255, 210, 74, .25);
}

#boostFill {
  display: block;
  height: 100%;
  width: 33%;
  background: linear-gradient(90deg, #ff8a3c, #ffd24a);
  transition: width .1s linear;
}

#boostRing.full #boostFill {
  background: linear-gradient(90deg, #ffd24a, #fff6c4);
}

.blabel {
  font-size: 9px;
  letter-spacing: .22em;
  color: var(--dim);
}

#speedo {
  position: absolute;
  left: calc(16px + var(--safeL));
  bottom: calc(16px + var(--safeB));
  display: flex;
  align-items: baseline;
  gap: 5px;
}

#speed {
  font-size: 30px;
  font-weight: 900;
}

#speedo .unit {
  font-size: 10px;
  letter-spacing: .16em;
  color: var(--dim);
}

#speedo.sonic #speed {
  color: #9fe8ff;
  text-shadow: 0 0 20px rgba(120, 220, 255, .9);
}

#bigtext {
  position: absolute;
  top: 34%;
  left: 0;
  right: 0;
  text-align: center;
  font-size: clamp(48px, 15vw, 110px);
  font-weight: 900;
  letter-spacing: .04em;
  color: #fff;
  text-shadow: 0 0 46px rgba(120, 190, 255, .9);
}

#bigtext.pop {
  animation: pop .55s cubic-bezier(.2, 1.5, .4, 1);
}

@keyframes pop {
  0% {
    transform: scale(.35);
    opacity: 0;
  }

  55% {
    transform: scale(1.12);
    opacity: 1;
  }

  100% {
    transform: scale(1);
    opacity: 1;
  }
}

#toast {
  position: absolute;
  top: 24%;
  left: 0;
  right: 0;
  text-align: center;
  font-size: clamp(18px, 4.4vw, 30px);
  font-weight: 900;
  letter-spacing: .16em;
  color: var(--gold);
  text-shadow: 0 0 26px rgba(255, 200, 60, .8);
}

#toast.pop {
  animation: pop .45s cubic-bezier(.2, 1.5, .4, 1);
}

#banner {
  position: absolute;
  top: 40%;
  left: 0;
  right: 0;
  text-align: center;
  opacity: 0;
  transform: scale(.7);
  transition: opacity .25s ease, transform .35s cubic-bezier(.2, 1.5, .4, 1);
}

#banner.on {
  opacity: 1;
  transform: scale(1);
}

.bteam {
  font-size: clamp(30px, 8vw, 62px);
  font-weight: 900;
  letter-spacing: .06em;
  text-shadow: 0 0 40px currentColor;
}

.bwho {
  font-size: clamp(16px, 3.6vw, 26px);
  font-weight: 800;
  letter-spacing: .3em;
  color: #fff;
  margin-top: 4px;
}

#flash {
  position: fixed;
  inset: 0;
  z-index: 30;
  pointer-events: none;
  opacity: 0;
  mix-blend-mode: screen;
  transition: opacity .12s linear;
}

/* ============ touch controls ============ */

#touch {
  position: fixed;
  inset: 0;
  z-index: 25;
  display: none;
  pointer-events: none;
  padding: 0 calc(16px + var(--safeR)) calc(14px + var(--safeB)) calc(16px + var(--safeL));
}

#touch.on {
  display: block;
}

#tStick {
  position: absolute;
  left: calc(22px + var(--safeL));
  bottom: calc(78px + var(--safeB));
  width: 148px;
  height: 148px;
  border-radius: 50%;
  border: 2px solid rgba(160, 210, 255, .28);
  background: radial-gradient(circle, rgba(30, 50, 90, .34), rgba(10, 18, 36, .20));
  pointer-events: auto;
  touch-action: none;
}

#tKnob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 62px;
  height: 62px;
  margin: -31px 0 0 -31px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #b6dbff, #3b7ac4);
  box-shadow: 0 4px 18px rgba(0, 0, 0, .55);
  transition: transform .04s linear;
}

#tPad {
  position: absolute;
  right: calc(18px + var(--safeR));
  bottom: calc(72px + var(--safeB));
  display: grid;
  grid-template-columns: repeat(2, auto);
  gap: 10px;
  justify-items: end;
  pointer-events: none;
}

.tbtn {
  pointer-events: auto;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .22);
  color: #fff;
  font: 800 11px/1 inherit;
  letter-spacing: .06em;
  background: rgba(20, 30, 56, .55);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  touch-action: none;
  cursor: pointer;
}

.tbtn.big {
  width: 88px;
  height: 88px;
  font-size: 13px;
}

.tbtn.small {
  width: 60px;
  height: 60px;
  font-size: 10px;
}

.tbtn.boost {
  background: radial-gradient(circle at 34% 28%, rgba(255, 210, 74, .85), rgba(190, 110, 20, .6));
  border-color: rgba(255, 220, 130, .6);
  color: #251500;
}

.tbtn.jump {
  background: radial-gradient(circle at 34% 28%, rgba(120, 200, 255, .85), rgba(30, 90, 170, .6));
  border-color: rgba(170, 225, 255, .6);
  color: #041625;
}

.tbtn.held {
  filter: brightness(1.5);
  transform: scale(.93);
}

#touch.mirrored #tStick {
  left: auto;
  right: calc(22px + var(--safeR));
}

#touch.mirrored #tPad {
  right: auto;
  left: calc(18px + var(--safeL));
  justify-items: start;
}

/* On touch the bottom-right corner belongs to the buttons, so the boost
   meter moves up out of their way. (`#touch` sits after `#hud` in the DOM,
   so a sibling selector can't reach back — hence the body class.) */
body.touch-ui #boostRing {
  bottom: auto;
  top: calc(54px + var(--safeT));
  right: calc(14px + var(--safeR));
  width: 92px;
}

body.touch-ui #boostNum {
  font-size: 25px;
}

body.touch-ui #boostBar {
  height: 6px;
  margin: 4px 0 2px;
}

body.touch-ui .blabel {
  font-size: 8px;
}

/* ============ rotate nag ============ */

#rotate {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: none;
  align-items: center;
  justify-content: center;
  background: #05070f;
  text-align: center;
}

#rotate.on {
  display: flex;
}

#rotate .ricon {
  font-size: 62px;
  animation: tilt 1.8s ease-in-out infinite;
}

#rotate p {
  color: var(--dim);
  letter-spacing: .1em;
  font-size: 14px;
}

@keyframes tilt {

  0%,
  100% {
    transform: rotate(0);
  }

  50% {
    transform: rotate(-90deg);
  }
}

/* ============ small screens ============ */

@media (max-height: 520px) {
  .card {
    padding: 14px;
    border-radius: 15px;
  }

  .logo .l1 {
    font-size: 26px;
  }

  .logo .l2 {
    font-size: 34px;
  }

  .btn {
    padding: 11px 14px;
    font-size: 12.5px;
  }

  .menu {
    gap: 6px;
    margin-top: 11px;
  }

  .sub {
    margin: 5px 0 3px;
  }

  #tStick {
    width: 120px;
    height: 120px;
    bottom: calc(20px + var(--safeB));
  }

  #tKnob {
    width: 52px;
    height: 52px;
    margin: -26px 0 0 -26px;
  }

  #tPad {
    bottom: calc(18px + var(--safeB));
  }

  .tbtn.big {
    width: 74px;
    height: 74px;
  }

  .tbtn.small {
    width: 52px;
    height: 52px;
  }
}

@media (max-width: 560px) {
  .statgrid {
    grid-template-columns: repeat(2, 1fr);
  }

  #boostNum {
    font-size: 26px;
  }

  #speed {
    font-size: 22px;
  }

  #scorebar .sc {
    font-size: 20px;
  }

  #clock {
    font-size: 16px;
  }
}

</style>
</head>

  <script>
/* ============================================================
   ROCKET RUMBLE — R3's Turbo League
   core.js — namespace, tuning constants, math, arena SDF, save data
   ============================================================ */
(function (global) {
  'use strict';

  var RL = global.RL = global.RL || {};
  RL.VERSION = '1.0.0';

  /* ---------------- tuning ---------------- */

  var ARENA = RL.ARENA = {
    hx: 40,        // half width   (X: -40 .. 40)
    hz: 50,        // half length  (Z: -50 .. 50)
    h: 20,         // ceiling height (Y: 0 .. 20)
    r: 6.0,        // corner fillet radius — the curved bits you can drive up
    goalW: 9.6,    // goal mouth half width
    goalH: 7.2,    // goal mouth height
    goalD: 8.0,    // how far the net reaches behind the goal line
    goalR: 0.8
  };
  /* The net box has to start at the foot of the floor-wall fillet, not at the
     goal line — otherwise the fillet curves up across the mouth and walls the
     goal off.  Cutting it back to hz - r carves a flat channel through the
     corner, which is exactly how the real arenas are shaped. */
  ARENA.goalFront = ARENA.hz - ARENA.r;             // 44
  ARENA.goalBack = ARENA.hz + ARENA.goalD;          // 58
  ARENA.goalCz = (ARENA.goalFront + ARENA.goalBack) * 0.5;
  ARENA.goalHz = (ARENA.goalBack - ARENA.goalFront) * 0.5;

  var BALL = RL.BALL = {
    radius: 1.35,
    gravity: 18.0,               // must match CAR.gravity
    drag: 0.030,        // per second
    restitution: 0.62,
    surfFriction: 0.32, // tangential scrub on bounce
    spinFromBounce: 0.55,
    spinDrag: 0.35,
    maxSpin: 14,
    magnus: 0.16,       // curve force coefficient
    maxSpeed: 75
  };

  var CAR = RL.CAR = {
    L: 2.30, W: 1.50, H: 0.68,   // full dimensions
    ride: 0.50,                  // wheel contact -> body centre height
    wheelR: 0.42,
    stick: 0.44,                 // extra reach that still counts as "on a surface"
    wallStickSpeed: 7.5,         // below this you slide off a vertical wall

    maxDrive: 30,                // top speed with throttle only
    maxSpeed: 42,                // top speed with boost
    supersonic: 39,

    accel: 46,                   // throttle accel at a standstill
    brake: 62,
    coast: 12,                   // engine braking when off throttle
    reverseMax: 15,

    boostAccel: 41,
    boostMax: 100,
    boostUse: 30,                // units per second
    boostMin: 0.20,              // minimum burn on a tap

    gripLat: 44,                 // sideways grip (units/s^2 of correction)
    gripDrift: 9.0,
    turn: 4.0,                   // base yaw rate rad/s
    turnFalloff: 0.40,           // how much the turn opens out at high speed

    /* Gravity is deliberately much stronger than a real-world scaling would
       give.  At 13 a single jump hung in the air for ~2s, which made every
       car feel like a balloon; 18 lands you in ~1.1s and keeps play snappy.
       BALL.gravity is kept identical so aerials read correctly. */
    gravity: 18.0,
    stickForce: 26,              // pull toward the surface (wall + ceiling driving)

    jump: 10.0,
    jumpHold: 15,                // extra accel while the jump button is held
    jumpHoldTime: 0.20,
    doubleJump: 8.0,
    flipImpulse: 17.5,
    flipForwardBonus: 6.0,
    flipTime: 0.62,              // how long the flip animation locks rotation
    flipWindow: 1.30,            // grace period for the second press

    airPitch: 9.0,
    airYaw: 7.5,
    airRoll: 11.0,
    airDamp: 5.6,                // higher = the car stops tumbling sooner
    airControlDrag: 0.55,
    levelAssist: 4.2,            // strength of the auto-level-in-the-air help

    demoSpeed: 39,               // must be supersonic to demolish
    demoRadius: 2.25,
    respawn: 3.0,

    mass: 180,
    ballMass: 30
  };

  var PADS = RL.PADS = {
    smallAmt: 12, bigAmt: 100, smallCool: 4.0, bigCool: 10.0,
    r: 1.15, bigR: 1.75      // visual radius; pickup adds a forgiving margin
  };

  /* ---------------- math ---------------- */

  var M = RL.M = {
    clamp: function (v, a, b) { return v < a ? a : (v > b ? b : v); },
    lerp: function (a, b, t) { return a + (b - a) * t; },
    sign: function (v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); },
    /* frame-rate independent exponential approach */
    damp: function (a, b, lambda, dt) { return b + (a - b) * Math.exp(-lambda * dt); },
    smooth: function (t) { return t * t * (3 - 2 * t); },
    /* shortest signed angle a->b */
    angleDelta: function (a, b) {
      var d = (b - a) % (Math.PI * 2);
      if (d > Math.PI) d -= Math.PI * 2;
      if (d < -Math.PI) d += Math.PI * 2;
      return d;
    },
    /* apply a deadzone then rescale so the stick still reaches 1.0 */
    dead: function (v, dz) {
      var a = Math.abs(v);
      if (a < dz) return 0;

  RL.rng = function (seed) {
    var a = seed >>> 0;

      var t = Math.imul(a ^ a >>> 15, 1 | a);

  /* ---------------- arena signed distance field ----------------
     The playable volume is the union of the main rounded box and the two
     goal boxes.  Union of solids = min() of their signed distances, which
     means walls, the curved corners and the insides of both nets all fall
     out of one function.  Negative = inside, and -sd is the distance to
     the nearest surface.                                                */

  function sdRoundBox(px, py, pz, hx, hy, hz, r) {
    var qx = Math.abs(px) - (hx - r),
      qy = Math.abs(py) - (hy - r),
      qz = Math.abs(pz) - (hz - r);

    var outer = Math.sqrt(ox * ox + oy * oy + oz * oz);

    var g1 = sdRoundBox(x, y - A.goalH * 0.5, z - A.goalCz,
      A.goalW, A.goalH * 0.5, A.goalHz, A.goalR);
    if (g1 < d) d = g1;
    var g2 = sdRoundBox(x, y - A.goalH * 0.5, z + A.goalCz,
      A.goalW, A.goalH * 0.5, A.goalHz, A.goalR);

    return d;

  /* distance from an interior point to the nearest surface (>= 0 inside) */
  RL.surfaceDist = function (p) { return -arenaSD(p.x, p.y, p.z); };

  /* inward-facing surface normal at p, via central differences */
  var _e = 0.05;

    var x = p.x, y = p.y, z = p.z;
    var nx = arenaSD(x + _e, y, z) - arenaSD(x - _e, y, z);
    var ny = arenaSD(x, y + _e, z) - arenaSD(x, y - _e, z);
    var nz = arenaSD(x, y, z + _e) - arenaSD(x, y, z - _e);
    var len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
    // gradient points outward (toward increasing sd) -> negate for inward
    out.set(-nx / len, -ny / len, -nz / len);
    return out;
  };

  /* is this point inside a scoring net? returns 0 / +1 (z+ net) / -1 (z- net) */
  RL.inNet = function (p) {
    var A = ARENA;
    if (Math.abs(p.x) > A.goalW || p.y > A.goalH) return 0;
    if (p.z > A.hz) return 1;
    if (p.z < -A.hz) return -1;
    return 0;
  };

  /* ---------------- persistent settings + progress ---------------- */

  var KEY = 'rocketRumbleR3';

  /* ---------------- canvas texture helpers ---------------- */

  function cv(w, h) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }
  function tex(canvas, rx, ry) {
    var t = new T.CanvasTexture(canvas);
    if (rx || ry) {
      t.wrapS = t.wrapT = T.RepeatWrapping;
      t.repeat.set(rx || 1, ry || 1);
    }
    t.anisotropy = 8;
    return t;
  }

  /* the pitch: mowed stripes, grid, and all the markings baked in */
  function makePitch(th) {
    var W = 1020, H = 1320;              // 15 px per world unit-ish
    var c = cv(W, H), g = c.getContext('2d');
    g.fillStyle = th.turf[0]; g.fillRect(0, 0, W, H);

    // mowed stripes down the length
    var stripes = 16;
    for (var i = 0; i < stripes; i++) {
      if (i % 2) continue;
      g.fillStyle = th.turf[1];
      g.fillRect(0, (i / stripes) * H, W, H / stripes);
    }
    // faint tech grid
    g.strokeStyle = th.grid; g.lineWidth = 1.5; g.globalAlpha = 0.5;
    for (var x = 0; x <= W; x += W / 20) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
    for (var y = 0; y <= H; y += H / 26) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    g.globalAlpha = 1;

    // speckle
    for (var s = 0; s < 2600; s++) {
      g.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.035) + ')';
      var sx = Math.random() * W, sy = Math.random() * H, ss = 1 + Math.random() * 3;
      g.fillRect(sx, sy, ss, ss);
    }

    // markings
    g.strokeStyle = th.turfLine; g.lineWidth = 5; g.globalAlpha = 0.85;
    g.strokeRect(8, 8, W - 16, H - 16);
    g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke();
    g.beginPath(); g.arc(W / 2, H / 2, W * 0.16, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.arc(W / 2, H / 2, W * 0.032, 0, Math.PI * 2);
    g.fillStyle = th.turfLine; g.fill();

    // goal creases + corner arcs
    var gw = W * 0.30, gd = H * 0.085;
    g.lineWidth = 4;
    [0, 1].forEach(function (end) {
      var yy = end ? H - gd : 0;
      g.strokeRect(W / 2 - gw / 2, yy, gw, gd);
      g.beginPath();
      g.arc(W / 2, end ? H : 0, W * 0.115, end ? Math.PI : 0, end ? Math.PI * 2 : Math.PI);
      g.stroke();
    });
    for (var k = 0; k < 4; k++) {
      var cx = (k & 1) ? W - 8 : 8, cy = (k & 2) ? H - 8 : 8;
      g.beginPath();
      g.arc(cx, cy, W * 0.055, 0, Math.PI * 2);
      g.stroke();
    }
    g.globalAlpha = 1;

    // R3 monogram at centre
    g.save();
    g.translate(W / 2, H / 2);
    g.globalAlpha = 0.22;
    g.fillStyle = th.turfLine;
    g.font = 'bold ' + Math.floor(W * 0.115) + 'px Arial Black, Impact, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('R3', 0, 2);
    g.restore();

    return tex(c);
  }

  /* wall panelling — tiled */
  function makeWall(th) {
    var S = 512, c = cv(S, S), g = c.getContext('2d');
    g.fillStyle = th.wall; g.fillRect(0, 0, S, S);
    var n = 4, cell = S / n;
    for (var i = 0; i < n; i++) for (var j = 0; j < n; j++) {
      var pad = 7;
      g.fillStyle = ((i + j) % 2) ? th.wallPanel : th.wall;
      g.fillRect(i * cell + pad, j * cell + pad, cell - pad * 2, cell - pad * 2);
      g.strokeStyle = th.wallEdge; g.globalAlpha = 0.28; g.lineWidth = 2;
      g.strokeRect(i * cell + pad, j * cell + pad, cell - pad * 2, cell - pad * 2);
      g.globalAlpha = 1;
      // rivets
      g.fillStyle = th.wallEdge; g.globalAlpha = 0.4;
      [[pad + 8, pad + 8], [cell - pad - 8, pad + 8], [pad + 8, cell - pad - 8], [cell - pad - 8, cell - pad - 8]]
        .forEach(function (p) {
          g.beginPath(); g.arc(i * cell + p[0], j * cell + p[1], 2.6, 0, 7); g.fill();
        });

    for (var s = 0; s < 400; s++) {
      g.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.16) + ')';
      g.fillRect(Math.random() * S, Math.random() * S, 1 + Math.random() * 22, 1 + Math.random() * 3);
    }

  }

  /* a wall of tiny people */
  function makeCrowd(th) {
    var W = 1024, H = 256, c = cv(W, H), g = c.getContext('2d');
    g.fillStyle = '#05060c'; g.fillRect(0, 0, W, H);
    var rows = 7;
    for (var r = 0; r < rows; r++) {
      var y = H - 16 - r * (H / rows) * 0.94;
      var sz = 8.0 + r * 0.7;
      for (var x = -6; x < W + 6; x += sz * 2.0) {
        if (Math.random() < 0.12) continue;
        g.fillStyle = th.crowd[(Math.random() * th.crowd.length) | 0];
        g.globalAlpha = 0.55 + Math.random() * 0.45;
        var jx = x + (Math.random() - 0.5) * sz, jy = y + (Math.random() - 0.5) * sz * 0.8;
        g.beginPath(); g.arc(jx, jy, sz * 0.5, 0, 7); g.fill();          // head
        g.fillRect(jx - sz * 0.42, jy + sz * 0.35, sz * 0.84, sz * 1.0); // body

    var grad = g.createLinearGradient(0, H - 30, 0, H);
    grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(0,0,0,0.9)');
    g.fillStyle = grad; g.fillRect(0, H - 30, W, 30);
    return tex(c, 5, 1);
  }

  /* goal netting — transparent grid */

    var S = 128, c = cv(S, S), g = c.getContext('2d');

      g.beginPath(); g.moveTo(0, p); g.lineTo(S, p); g.stroke();

  /* soft radial blob — shadows, glows, sparks */

    if (_blob) return _blob;
    var S = 128, c = cv(S, S), g = c.getContext('2d');
    var gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.45, 'rgba(255,255,255,0.55)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, S, S);

  }

    if (_ring) return _ring;

    g.strokeStyle = 'rgba(255,255,255,1)';
    g.lineWidth = 16; g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 20, 0, 7); g.stroke();
    g.lineWidth = 5; g.globalAlpha = 0.5;

  /* ---------------- rounded-rectangle helper ----------------
     Walks the perimeter of a rounded rect in XZ — this is the arena's
     horizontal cross-section anywhere along the vertical wall band. */
  function roundRect(hx, hz, r, steps) {
    var pts = [], i, a;
    var q = Math.max(2, Math.round(steps / 4));
    // +X +Z corner  -> angles 0..90 measured from +X axis
    var cs = [[hx - r, hz - r, 0], [-(hx - r), hz - r, Math.PI * 0.5],
    [-(hx - r), -(hz - r), Math.PI], [hx - r, -(hz - r), Math.PI * 1.5]];
    for (var c = 0; c < 4; c++) {
      for (i = 0; i < q; i++) {
        a = cs[c][2] + (i / q) * Math.PI * 0.5;
        pts.push([cs[c][0] + Math.cos(a) * r, cs[c][1] + Math.sin(a) * r]);
      }

    return pts;
  }

  /* ---------------- the shell ----------------
     A sphere's worth of directions, each pushed out to the exact zero
     crossing of RL.arenaSD.  Mesh == collision surface, by construction. */

  function buildShell(quality, th) {
    var segW = quality === 'low' ? 48 : (quality === 'medium' ? 72 : 100);
    var segH = quality === 'low' ? 28 : (quality === 'medium' ? 40 : 56);
    // hue of the pitch, normalised so it tints the corner ramps rather than
    // just darkening them
    var turf = new T.Color(th.turf[0]);
    var mx = Math.max(turf.r, turf.g, turf.b) || 1;
    var tr = turf.r / mx, tg = turf.g / mx, tb = turf.b / mx;
    var geo = new T.SphereGeometry(1, segW, segH);
    var pos = geo.attributes.position;
    // Ray origin sits inside the goal mouth's height range so rays fired at
    // the nets pass cleanly through the opening and hit the back of the net.
    var cx = 0, cy = A.goalH * 0.48, cz = 0;
    var col = new Float32Array(pos.count * 3);
    var uv = geo.attributes.uv;
    var v = new T.Vector3();

    for (var i = 0; i < pos.count; i++) {
      v.set(pos.getX(i), pos.getY(i), pos.getZ(i)).normalize();
      // bisect for the surface along this ray
      var lo = 0.1, hi = 130;
      if (RL.arenaSD(cx + v.x * hi, cy + v.y * hi, cz + v.z * hi) < 0) {
        // ray never leaves (shouldn't happen) — clamp
      }
      for (var it = 0; it < 26; it++) {
        var mid = (lo + hi) * 0.5;
        if (RL.arenaSD(cx + v.x * mid, cy + v.y * mid, cz + v.z * mid) < 0) lo = mid; else hi = mid;
      }
      var t = (lo + hi) * 0.5;
      var px = cx + v.x * t, py = cy + v.y * t, pz = cz + v.z * t;
      pos.setXYZ(i, px, py, pz);

      // planar UVs chosen by whichever axis the surface faces
      var ax = Math.abs(v.x), ay = Math.abs(v.y), az = Math.abs(v.z);
      var u0, v0;
      if (ay > ax && ay > az) { u0 = px / 11; v0 = pz / 11; }
      else if (ax > az) { u0 = pz / 11; v0 = py / 9; }
      else { u0 = px / 11; v0 = py / 9; }
      uv.setXY(i, u0, v0);

      // vertical shade ramp + a warm pool over each goal mouth
      var up = M.clamp(py / A.h, 0, 1);
      var shade = 1.05 - up * 0.55;
      var nearGoal = M.clamp(1 - (Math.abs(Math.abs(pz) - A.hz) / 26), 0, 1) *
        M.clamp(1 - Math.abs(px) / 30, 0, 1);

      // like a rug thrown down in the middle of a differently-coloured floor
      var low = M.clamp(1 - py / (A.r * 1.25), 0, 1) * 0.9;
      col[i * 3] = (shade + nearGoal * 0.22) * M.lerp(1, tr, low);
      col[i * 3 + 1] = (shade + nearGoal * 0.10) * M.lerp(1, tg, low);
      col[i * 3 + 2] = (shade + nearGoal * 0.26) * M.lerp(1, tb, low);
    }
    /* Drop every triangle that lies wholly in the floor / corner-ramp zone.
       Ray-projecting a sphere puts each vertex exactly on the surface, but
       the chords between them cut across — near the floor those rays fan out
       so fast that the mesh bulged up to 0.65 units above the pitch and hid
       half of it. buildFloorField() covers that zone exactly instead. */
    var idx = geo.index.array;
    var keep = [];
    for (var f = 0; f < idx.length; f += 3) {
      var a = idx[f], b = idx[f + 1], c = idx[f + 2];
      if (pos.getY(a) < A.r && pos.getY(b) < A.r && pos.getY(c) < A.r) continue;
      keep.push(a, b, c);
    }
    geo.setIndex(keep);

    geo.setAttribute('color', new T.BufferAttribute(col, 3));
    geo.computeVertexNormals();
    geo.attributes.position.needsUpdate = true;
    return geo;
  }

  /* The floor and the curved corner ramps, as a heightfield sampled straight
     off the SDF — one height per (x, z), so it is exact by construction. */
  function buildFloorField(th, quality) {
    var nx = quality === 'low' ? 44 : (quality === 'medium' ? 72 : 108);
    var nz = Math.round(nx * A.hz / A.hx);
    var geo = new T.PlaneGeometry(A.hx * 2 - 0.2, A.hz * 2 - 0.2, nx, nz);
    geo.rotateX(-Math.PI / 2);
    var pos = geo.attributes.position, uv = geo.attributes.uv;
    var col = new Float32Array(pos.count * 3);
    var fw = A.hx - A.r, fl = A.hz - A.r;

    for (var i = 0; i < pos.count; i++) {
      var x = pos.getX(i), z = pos.getZ(i), y = 0;
      if (RL.arenaSD(x, 0, z) >= 0) {           // outside at ground level: on a ramp
        var lo = 0, hi = A.r + 2.0;
        for (var it = 0; it < 24; it++) {
          var mid = (lo + hi) * 0.5;
          if (RL.arenaSD(x, mid, z) < 0) hi = mid; else lo = mid;
        }
        y = hi;
      }
      pos.setY(i, y);
      // the pitch texture spans the flat area and clamps up the ramps
      uv.setXY(i, x / (fw * 2) + 0.5, 0.5 - z / (fl * 2));
      // ...and the ramps darken into the wall tone as they climb

      var k = 1 - t * 0.62;
      col[i * 3] = k; col[i * 3 + 1] = k; col[i * 3 + 2] = k * (1 + t * 0.28);
    }
    geo.setAttribute('color', new T.BufferAttribute(col, 3));
    geo.computeVertexNormals();
    return geo;
  }

  /* ---------------- Arena class ---------------- */

  function Arena(scene, themeKey, quality) {
    this.scene = scene;
    this.theme = THEMES[themeKey] || THEMES.dome;
    this.quality = quality;
    this.group = new T.Group();
    this.disposables = [];
    this.pads = [];
    this.goalLights = [];
    this.crowdMats = [];
    this.embers = null;
    this.t = 0;
    scene.add(this.group);
    this.build();
  }

  Arena.prototype._track = function (o) { this.disposables.push(o); return o; };

  Arena.prototype.build = function () {
    var th = this.theme, self = this, i;

    /* --- shell --- */
    var shellGeo = this._track(buildShell(this.quality, th));
    var wallTex = this._track(makeWall(th));
    var shellMat = this._track(new T.MeshLambertMaterial({
      map: wallTex, side: T.BackSide, vertexColors: true
    }));
    var shell = new T.Mesh(shellGeo, shellMat);
    shell.name = 'shell';
    this.group.add(shell);

    /* --- pitch + corner ramps, as one exact heightfield --- */
    var pitchGeo = this._track(buildFloorField(th, this.quality));
    var pitchMat = this._track(new T.MeshLambertMaterial({
      map: this._track(makePitch(th)), vertexColors: true
    }));
    var pitch = new T.Mesh(pitchGeo, pitchMat);
    pitch.position.y = 0.012;
    pitch.receiveShadow = true;
    this.group.add(pitch);
    this.pitch = pitch;

    /* --- neon trim: a glowing rail where the wall meets the floor, and
           another at the top of the crowd --- */
    function trimRing(y, thick, color, inset) {
      var pts = roundRect(A.hx - inset, A.hz - inset, A.r, 96);
      var g = new T.BufferGeometry();
      var n = pts.length, arr = new Float32Array(n * 6 * 3), k = 0;
      for (var i2 = 0; i2 < n; i2++) {
        var p = pts[i2], q = pts[(i2 + 1) % n];
        var a = [p[0], y, p[1]], b = [q[0], y, q[1]],
          c = [q[0], y + thick, q[1]], d = [p[0], y + thick, p[1]];
        [a, b, c, a, c, d].forEach(function (vv) {
          arr[k++] = vv[0]; arr[k++] = vv[1]; arr[k++] = vv[2];
        });
      }
      g.setAttribute('position', new T.BufferAttribute(arr, 3));
      var m = new T.MeshBasicMaterial({
        color: color, side: T.DoubleSide, transparent: true, opacity: 0.95,
        blending: T.AdditiveBlending, depthWrite: false
      });
      self._track(g); self._track(m);
      return new T.Mesh(g, m);
    }
    this.group.add(trimRing(0.06, 0.30, th.trim, 0.10));
    this.group.add(trimRing(A.h - A.r - 0.6, 0.22, th.trim2, 0.10));
    this.group.add(trimRing(6.6, 0.14, th.trim2, 0.10));

    /* --- crowd band --- */
    (function () {
      var y0 = 7.2, y1 = 13.2, inset = 0.14;
      var pts = roundRect(A.hx - inset, A.hz - inset, A.r, 128);
      var n = pts.length;
      var g = new T.BufferGeometry();
      var arr = new Float32Array(n * 6 * 3), uvs = new Float32Array(n * 6 * 2);
      var k = 0, uk = 0, run = 0;
      for (var i2 = 0; i2 < n; i2++) {
        var p = pts[i2], q = pts[(i2 + 1) % n];
        var seg = Math.hypot(q[0] - p[0], q[1] - p[1]);
        var u0 = run / 14, u1 = (run + seg) / 14; run += seg;
        var quad = [[p, y0, u0, 0], [q, y0, u1, 0], [q, y1, u1, 1],
        [p, y0, u0, 0], [q, y1, u1, 1], [p, y1, u0, 1]];
        for (var z = 0; z < 6; z++) {
          arr[k++] = quad[z][0][0]; arr[k++] = quad[z][1]; arr[k++] = quad[z][0][1];
          uvs[uk++] = quad[z][2]; uvs[uk++] = quad[z][3];
        }
      }
      g.setAttribute('position', new T.BufferAttribute(arr, 3));
      g.setAttribute('uv', new T.BufferAttribute(uvs, 2));
      // DoubleSide: the strip's winding follows the perimeter, so which face
      // points into the arena flips at the corners
      var m = new T.MeshBasicMaterial({
        map: self._track(makeCrowd(th)), side: T.DoubleSide, color: 0xc2cbdd
      });
      self._track(g); self._track(m);
      self.crowdMats.push(m);
      self.group.add(new T.Mesh(g, m));
    })();

    /* --- goals --- */
    this.goals = [];
    [1, -1].forEach(function (side) {
      var teamColor = side > 0 ? 0xff6b3d : 0x3da5ff;   // +Z net is orange's, -Z is blue's
      var g = new T.Group();
      var z = side * A.hz;

      // frame
      var fm = self._track(new T.MeshBasicMaterial({ color: teamColor }));
      var bar = 0.42;
      var top = new T.Mesh(self._track(new T.BoxGeometry(A.goalW * 2 + bar * 2, bar, bar)), fm);
      top.position.set(0, A.goalH, z);
      var lp = new T.Mesh(self._track(new T.BoxGeometry(bar, A.goalH, bar)), fm);
      lp.position.set(-A.goalW - bar / 2, A.goalH / 2, z);
      var rp = lp.clone(); rp.position.x = A.goalW + bar / 2;
      g.add(top, lp, rp);

      // glowing mouth plane you can see from across the pitch
      var glowMat = self._track(new T.MeshBasicMaterial({
        color: teamColor, transparent: true, opacity: 0.20,
        blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide
      }));
      var glow = new T.Mesh(self._track(new T.PlaneGeometry(A.goalW * 2, A.goalH)), glowMat);
      glow.position.set(0, A.goalH / 2, z - side * 0.05);
      g.add(glow);

      // netting on the three inner faces of the box
      var netMat = self._track(new T.MeshBasicMaterial({
        map: self._track(makeNet()), transparent: true, side: T.DoubleSide,
        color: teamColor, opacity: 0.85, depthWrite: false
      }));
      var D = A.goalD;
      var back = new T.Mesh(self._track(new T.PlaneGeometry(A.goalW * 2, A.goalH)), netMat);
      back.position.set(0, A.goalH / 2, z + side * D);
      g.add(back);
      [-1, 1].forEach(function (sx) {
        var sidep = new T.Mesh(self._track(new T.PlaneGeometry(D, A.goalH)), netMat);
        sidep.rotation.y = Math.PI / 2;
        sidep.position.set(sx * A.goalW, A.goalH / 2, z + side * D / 2);
        g.add(sidep);
      });
      var ceilp = new T.Mesh(self._track(new T.PlaneGeometry(A.goalW * 2, D)), netMat);
      ceilp.rotation.x = Math.PI / 2;
      ceilp.position.set(0, A.goalH, z + side * D / 2);
      g.add(ceilp);

      // point light that flares on a goal
      var light = new T.PointLight(teamColor, 0.0, 60, 2);
      light.position.set(0, A.goalH * 0.6, z - side * 3);
      g.add(light);
      self.goalLights.push(light);

      self.group.add(g);
      self.goals.push({ side: side, group: g, glow: glowMat, frame: fm, light: light, color: teamColor });
    });

    /* --- boost pads --- */
    this.buildPads();

    /* --- lights --- */
    var hemi = new T.HemisphereLight(0xffffff, th.fog, th.hemi);
    this.group.add(hemi);
    var amb = new T.AmbientLight(th.ambient, 0.42);
    this.group.add(amb);
    var sun = new T.DirectionalLight(th.sun, th.sunI);
    sun.position.set(28, 60, 18);
    this.group.add(sun);
    var sun2 = new T.DirectionalLight(th.sun, th.sunI * 0.34);
    sun2.position.set(-30, 42, -26);
    this.group.add(sun2);
    this.sun = sun;

    /* --- stars / ceiling sparkle --- */
    if (th.stars) {
      var count = this.quality === 'low' ? 220 : 520;
      var sg = new T.BufferGeometry(), sp = new Float32Array(count * 3);
      for (i = 0; i < count; i++) {
        var ang = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random());
        sp[i * 3] = Math.cos(ang) * rr * (A.hx - 2);
        sp[i * 3 + 1] = A.h - 0.3 - Math.random() * 2.4;
        sp[i * 3 + 2] = Math.sin(ang) * rr * (A.hz - 2);
      }
      sg.setAttribute('position', new T.BufferAttribute(sp, 3));
      var sm = new T.PointsMaterial({
        size: 0.75, map: starTex(), transparent: true, depthWrite: false,
        blending: T.AdditiveBlending, color: 0xffffff, sizeAttenuation: true
      });
      this._track(sg); this._track(sm);
      this.starField = new T.Points(sg, sm);
      this.group.add(this.starField);
    }

    if (th.embers && this.quality !== 'low') {
      var ec = 180, eg = new T.BufferGeometry(), ep = new Float32Array(ec * 3);
      this.emberVel = new Float32Array(ec);
      for (i = 0; i < ec; i++) {
        ep[i * 3] = (Math.random() * 2 - 1) * (A.hx - 4);
        ep[i * 3 + 1] = Math.random() * A.h;
        ep[i * 3 + 2] = (Math.random() * 2 - 1) * (A.hz - 4);
        this.emberVel[i] = 0.8 + Math.random() * 2.2;
      }
      eg.setAttribute('position', new T.BufferAttribute(ep, 3));
      var em = new T.PointsMaterial({
        size: 0.5, map: blobTex(), transparent: true, opacity: 0.85,
        depthWrite: false, blending: T.AdditiveBlending, color: 0xff7a2e

      this.embers = new T.Points(eg, em);
      this.group.add(this.embers);
    }

    this.scene.fog = new T.FogExp2(th.fog, 0.0042);
    this.scene.background = new T.Color(th.sky);
  };

  /* Rocket-League-style pad layout: 6 big corners/sides + a grid of smalls */
  Arena.prototype.buildPads = function () {
    var self = this, th = this.theme;
    var big = [
      [-(A.hx - 4.5), -(A.hz - 6.5)], [A.hx - 4.5, -(A.hz - 6.5)],
      [-(A.hx - 4.5), A.hz - 6.5], [A.hx - 4.5, A.hz - 6.5],
      [-(A.hx - 3.0), 0], [A.hx - 3.0, 0]
    ];
    var small = [
      [0, -34], [0, -17], [0, 0], [0, 17], [0, 34],
      [-17, -26], [17, -26], [-17, 26], [17, 26],
      [-25, -9], [25, -9], [-25, 9], [25, 9],
      [-9, -40], [9, -40], [-9, 40], [9, 40],
      [-30, -34], [30, -34], [-30, 34], [30, 34],
      [-17, 0], [17, 0], [-31, 0], [31, 0]
    ];

    var ringGeo = this._track(new T.PlaneGeometry(1, 1));

    function mk(x, z, isBig) {
      var color = isBig ? 0xffd24a : 0xffe98a;
      var r = isBig ? RL.PADS.bigR : RL.PADS.r;
      // soft radial falloff, so a pad reads as a pool of light rather than
      // a flat plate stuck to the pitch
      var mat = self._track(new T.MeshBasicMaterial({
        map: blobTex(), color: color, transparent: true, opacity: 0.55,
        blending: T.AdditiveBlending, depthWrite: false
      }));
      var disc = new T.Mesh(ringGeo, mat);
      disc.rotation.x = -Math.PI / 2;
      disc.position.set(x, 0.06, z);
      disc.scale.setScalar(r * 2.4);
      self.group.add(disc);

      var ringMat = self._track(new T.MeshBasicMaterial({
        map: ringTex(), color: color, transparent: true, opacity: 0.9,
        blending: T.AdditiveBlending, depthWrite: false
      }));
      var ring = new T.Mesh(ringGeo, ringMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(x, 0.09, z);
      ring.scale.setScalar(r * 2.1);
      self.group.add(ring);

      var pillar = null;
      if (isBig) {
        var pMat = self._track(new T.MeshBasicMaterial({
          map: blobTex(), color: color, transparent: true, opacity: 0.30,
          blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide
        }));
        pillar = new T.Mesh(self._track(new T.PlaneGeometry(r * 2.0, 4.2)), pMat);
        pillar.position.set(x, 2.1, z);
        self.group.add(pillar);
      }

      self.pads.push({
        x: x, z: z, big: isBig, r: r,
        amount: isBig ? RL.PADS.bigAmt : RL.PADS.smallAmt,
        cool: isBig ? RL.PADS.bigCool : RL.PADS.smallCool,
        timer: 0, disc: disc, ring: ring, pillar: pillar,
        mat: mat, ringMat: ringMat
      });
    }
    big.forEach(function (p) { mk(p[0], p[1], true); });
    small.forEach(function (p) { mk(p[0], p[1], false); });
  };

  Arena.prototype.update = function (dt, camera) {
    this.t += dt;
    var i, p;
    for (i = 0; i < this.pads.length; i++) {
      p = this.pads[i];
      if (p.timer > 0) {
        p.timer -= dt;
        var frac = 1 - p.timer / p.cool;
        var o = p.timer > 0 ? 0.06 : 0.55;
        p.mat.opacity = p.timer > 0 ? 0.05 + frac * 0.1 : 0.55;
        p.ringMat.opacity = p.timer > 0 ? 0.08 + frac * 0.35 : 0.9;
        p.ring.scale.setScalar(p.r * (p.timer > 0 ? 1.0 + frac * 1.1 : 2.1));
        if (p.pillar) p.pillar.visible = p.timer <= 0;
      } else {
        var pulse = 0.75 + Math.sin(this.t * 3.0 + i * 0.7) * 0.25;
        p.ringMat.opacity = 0.55 + pulse * 0.4;
        p.ring.scale.setScalar(p.r * (1.95 + pulse * 0.20));
        p.mat.opacity = 0.35 + pulse * 0.25;
        if (p.pillar) {
          p.pillar.visible = true;
          p.pillar.material.opacity = 0.16 + pulse * 0.2;
          if (camera) p.pillar.rotation.y = Math.atan2(camera.position.x - p.x, camera.position.z - p.z);
        }
      }
    }

    // goal glow breathes
    for (i = 0; i < this.goals.length; i++) {
      var g = this.goals[i];
      g.glow.opacity = 0.16 + Math.sin(this.t * 2 + i * 2) * 0.06;
      if (g.light.intensity > 0) g.light.intensity = Math.max(0, g.light.intensity - dt * 2.2);
    }

    // crowd settles back to its resting brightness after a cheer
    for (i = 0; i < this.crowdMats.length; i++) {
      var m = this.crowdMats[i], c = m.color;
      c.r = M.damp(c.r, 0.76, 3, dt);
      c.g = M.damp(c.g, 0.80, 3, dt);
      c.b = M.damp(c.b, 0.87, 3, dt);
    }

    if (this.starField) this.starField.rotation.y += dt * 0.012;

    if (this.embers) {
      var arr = this.embers.geometry.attributes.position.array;
      for (i = 0; i < this.emberVel.length; i++) {
        arr[i * 3 + 1] += this.emberVel[i] * dt;
        arr[i * 3] += Math.sin(this.t * 0.8 + i) * dt * 0.6;
        if (arr[i * 3 + 1] > A.h) {
          arr[i * 3 + 1] = 0.2;
          arr[i * 3] = (Math.random() * 2 - 1) * (A.hx - 4);
          arr[i * 3 + 2] = (Math.random() * 2 - 1) * (A.hz - 4);
        }
      }
      this.embers.geometry.attributes.position.needsUpdate = true;
    }
  };

  Arena.prototype.cheer = function (amount) {
    for (var i = 0; i < this.crowdMats.length; i++) {
      this.crowdMats[i].color.setRGB(1.6 * amount, 1.5 * amount, 1.7 * amount);
    }
  };

  Arena.prototype.flashGoal = function (side) {
    for (var i = 0; i < this.goals.length; i++) {
      if (this.goals[i].side === side) this.goals[i].light.intensity = 5.5;
    }
  };

  Arena.prototype.dispose = function () {
    this.scene.remove(this.group);
    this.group.traverse(function (o) { /* geometry/material freed below */ });
    for (var i = 0; i < this.disposables.length; i++) {
      var d = this.disposables[i];
      if (d && d.dispose) d.dispose();
    }
    this.disposables.length = 0;
    this.pads.length = 0;
    this.scene.fog = null;
  };

  RL.Arena = Arena;

})(window);

  <script>
/* ============================================================
   car.js — the battle-car: model, and the physics that makes it
   feel like Rocket League (wall driving, flips, aerials, demos).
   ============================================================ */
(function (global) {
  'use strict';
  var RL = global.RL, T = global.THREE, M = RL.M, C = RL.CAR, A = RL.ARENA;

  /* ---------------- body shapes ----------------
     Each one is a real handling trade-off, not just a repaint. */
  /* `nose` sets how low the bonnet runs, `roof` how tall the cabin is
     (as a fraction of half-height, so ~1.0 fills the collision box). */
  var BODIES = RL.BODIES = [
    { name: 'Turbo', desc: 'All-rounder', L: 2.30, W: 1.50, H: 0.68, nose: 0.80, roof: 0.96, wing: 0.55, speed: 1.00, turn: 1.00, power: 1.00 },
    { name: 'Dart', desc: 'Fast + nimble', L: 2.45, W: 1.36, H: 0.56, nose: 0.62, roof: 0.90, wing: 0.75, speed: 1.06, turn: 1.10, power: 0.90 },
    { name: 'Tank', desc: 'Heavy hitter', L: 2.20, W: 1.72, H: 0.86, nose: 0.94, roof: 1.00, wing: 0.35, speed: 0.94, turn: 0.90, power: 1.16 },
    { name: 'Wedge', desc: 'Grippy sniper', L: 2.55, W: 1.44, H: 0.50, nose: 0.52, roof: 0.86, wing: 0.95, speed: 1.02, turn: 1.06, power: 0.96 }
  ];

  RL.ACCENTS = [
    { name: 'Inferno', c: 0xff6a1a }, { name: 'Electric', c: 0x2ee6ff },
    { name: 'Venom', c: 0x8cff3a }, { name: 'Royal', c: 0xa259ff },
    { name: 'Gold', c: 0xffc93c }, { name: 'Hot Pink', c: 0xff3d9a },
    { name: 'Arctic', c: 0xeaf6ff }, { name: 'Crimson', c: 0xff2b4a }
  ];

  /* ---------------- mesh ----------------
     The body is a side-on silhouette extruded across the car's width with a
     bevel, which reads as an actual car instead of a shaped box.  The shape
     is drawn in XY (x = length, nose at +x; y = height) then rotated so
     length runs down +Z to match the car's forward axis. */

  function bodyGeometry(B, quality) {
    var hl = B.L / 2, hh = B.H / 2;
    var roof = B.roof, nose = B.nose;
    var s = new T.Shape();

    s.moveTo(-hl * 0.98, -hh);
    s.lineTo(hl * 0.84, -hh);                                     // floor pan
    s.quadraticCurveTo(hl, -hh, hl, -hh * 0.34);                  // front air dam
    s.quadraticCurveTo(hl, -hh * 0.05, hl * 0.84, hh * (nose - 0.55) * 0.55);
    s.quadraticCurveTo(hl * 0.55, hh * (nose - 0.42) * 0.7,       // bonnet
      hl * 0.30, hh * roof * 0.34);
    s.quadraticCurveTo(hl * 0.12, hh * roof * 0.72,               // windscreen
      hl * 0.02, hh * roof);
    s.lineTo(-hl * 0.30, hh * roof);                              // roof
    s.quadraticCurveTo(-hl * 0.56, hh * roof * 0.98,              // rear screen
      -hl * 0.70, hh * roof * 0.42);
    s.lineTo(-hl * 0.92, hh * roof * 0.34);                       // boot lid
    s.quadraticCurveTo(-hl * 0.99, hh * roof * 0.30, -hl, -hh * 0.20);
    s.closePath();

    var bev = 0.055;
    // The slab is deliberately narrower than the car's full width: the wheels
    // then stand proud of the flanks instead of being swallowed by them.
    var depth = B.W * 0.84 - bev * 2;
    var geo = new T.ExtrudeGeometry(s, {
      depth: depth,
      bevelEnabled: true,
      bevelThickness: bev,
      bevelSize: bev,
      bevelSegments: quality === 'low' ? 1 : 2,
      curveSegments: quality === 'low' ? 4 : 8
    });
    geo.translate(0, 0, -depth / 2);
    geo.rotateY(-Math.PI / 2);          // length -> +Z, width -> X
    geo.computeVertexNormals();
    return geo;
  }

  /* one wheel: tyre + a faceted rim that reads as spokes */
  function wheelGeos(wr, quality) {
    var seg = quality === 'low' ? 8 : 16;
    var tyre = new T.CylinderGeometry(wr, wr, wr * 0.72, seg);
    tyre.rotateZ(Math.PI / 2);
    var rim = new T.CylinderGeometry(wr * 0.52, wr * 0.52, wr * 0.76, quality === 'low' ? 5 : 6);
    rim.rotateZ(Math.PI / 2);
    var hub = new T.CylinderGeometry(wr * 0.17, wr * 0.17, wr * 0.80, 6);
    hub.rotateZ(Math.PI / 2);
    return [tyre, rim, hub];
  }

  function buildCarMesh(bodyIdx, teamColor, accentColor, quality) {
    var B = BODIES[bodyIdx % BODIES.length];
    var root = new T.Group();
    var refs = { wheels: [], flames: [], B: B };

    var bodyMat = new T.MeshPhongMaterial({
      color: teamColor, shininess: 96, specular: 0xb9cde6,
      emissive: teamColor, emissiveIntensity: 0.05
    });
    var accentMat = new T.MeshPhongMaterial({
      color: accentColor, shininess: 120, specular: 0xffffff,
      emissive: accentColor, emissiveIntensity: 0.14
    });
    var darkMat = new T.MeshPhongMaterial({ color: 0x171a24, shininess: 46, specular: 0x60708c });
    var glassMat = new T.MeshPhongMaterial({
      color: 0x0a1220, shininess: 190, specular: 0xd6ecff,
      transparent: true, opacity: 0.80
    });

    var chassis = new T.Mesh(bodyGeometry(B, quality), bodyMat);
    chassis.castShadow = true;
    root.add(chassis);
    refs.chassis = chassis;

    var hw = B.W / 2, hh = B.H / 2, hl = B.L / 2, roof = B.roof;

    // glasshouse — a dark wedge sunk into the cabin so it reads as windows
    var glassShape = new T.Shape();
    glassShape.moveTo(hl * 0.30, hh * roof * 0.34);
    glassShape.lineTo(hl * 0.02, hh * roof * 1.01);
    glassShape.lineTo(-hl * 0.30, hh * roof * 1.01);
    glassShape.lineTo(-hl * 0.68, hh * roof * 0.44);
    glassShape.closePath();
    var gd = B.W * 0.84 + 0.02;
    var gg = new T.ExtrudeGeometry(glassShape, { depth: gd, bevelEnabled: false });
    gg.translate(0, 0, -gd / 2);
    gg.rotateY(-Math.PI / 2);
    var canopy = new T.Mesh(gg, glassMat);
    root.add(canopy);

    // spine stripe over the bonnet and roof
    var stripe = new T.Mesh(new T.BoxGeometry(B.W * 0.17, 0.02, B.L * 0.34), accentMat);
    stripe.position.set(0, hh * roof * 0.30 + 0.02, hl * 0.56);
    stripe.rotation.x = -0.22;
    root.add(stripe);

    // side skirts + a flank flash in the accent colour
    [-1, 1].forEach(function (s) {
      var skirt = new T.Mesh(new T.BoxGeometry(0.07, 0.10, B.L * 0.60), darkMat);
      skirt.position.set(s * B.W * 0.41, -hh * 0.74, -B.L * 0.02);
      root.add(skirt);
      var flash = new T.Mesh(new T.BoxGeometry(0.03, 0.09, B.L * 0.40), accentMat);
      flash.position.set(s * (B.W * 0.42 + 0.005), -hh * 0.16, B.L * 0.02);
      root.add(flash);
    });

    // front splitter and rear diffuser
    var splitter = new T.Mesh(new T.BoxGeometry(B.W * 0.86, 0.06, 0.30), accentMat);
    splitter.position.set(0, -hh * 0.86, hl * 0.86);
    root.add(splitter);
    var diffuser = new T.Mesh(new T.BoxGeometry(B.W * 0.76, 0.14, 0.26), darkMat);
    diffuser.position.set(0, -hh * 0.62, -hl * 0.92);
    diffuser.rotation.x = 0.32;
    root.add(diffuser);

    // grille
    var grille = new T.Mesh(new T.BoxGeometry(B.W * 0.52, 0.10, 0.06), darkMat);
    grille.position.set(0, -hh * 0.40, hl * 0.965);
    root.add(grille);

    // rear wing on struts
    if (B.wing > 0.4) {
      var wingY = hh * roof * 0.92 + B.wing * 0.20;
      var wing = new T.Mesh(new T.BoxGeometry(B.W * 0.80, 0.05, 0.27), accentMat);
      wing.position.set(0, wingY, -hl * 0.88);
      wing.rotation.x = -0.28;
      root.add(wing);
      [-1, 1].forEach(function (s) {
        var strut = new T.Mesh(new T.BoxGeometry(0.065, B.wing * 0.34, 0.15), darkMat);
        strut.position.set(s * B.W * 0.32, wingY - B.wing * 0.17, -hl * 0.86);
        root.add(strut);
      });
    }

    // lights
    var hlMat = new T.MeshBasicMaterial({ color: 0xfff6dc });
    var tlMat = new T.MeshBasicMaterial({ color: 0xff3348 });
    [-1, 1].forEach(function (s) {
      var hlm = new T.Mesh(new T.BoxGeometry(0.26, 0.075, 0.05), hlMat);
      hlm.position.set(s * B.W * 0.26, hh * 0.06, hl * 0.985);
      hlm.rotation.z = s * 0.10;
      root.add(hlm);
    });
    var bar = new T.Mesh(new T.BoxGeometry(B.W * 0.72, 0.06, 0.04), tlMat);
    bar.position.set(0, hh * roof * 0.28, -hl * 0.975);
    root.add(bar);

    // Wheels. Radius is only loosely tied to body height — deriving it
    // directly gave monster-truck tyres taller than the car. The vertical
    // placement is solved from the ride height so the treads sit on the deck.
    var wr = 0.22 + B.H * 0.075;
    var wheelY = -(C.ride - wr);
    var wg = wheelGeos(wr, quality);
    var tyreMat = new T.MeshPhongMaterial({ color: 0x0e0f14, shininess: 18, specular: 0x39404f });
    var rimMat = new T.MeshPhongMaterial({ color: accentColor, shininess: 150, specular: 0xffffff });
    var hubMat = new T.MeshPhongMaterial({ color: 0x2b303c, shininess: 90, specular: 0xc8d6ea });
    [[-1, 1], [1, 1], [-1, -1], [1, -1]].forEach(function (q) {
      var w = new T.Group();
      w.add(new T.Mesh(wg[0], tyreMat), new T.Mesh(wg[1], rimMat), new T.Mesh(wg[2], hubMat));
      w.position.set(q[0] * (hw - 0.02), wheelY, q[1] * B.L * 0.335);
      w.userData.steers = q[1] > 0;
      root.add(w);
      refs.wheels.push(w);
    });
    refs.wheelGeo = wg;
    refs.mats.push(tyreMat, rimMat, hubMat, hlMat, tlMat);

    // boost nozzles + flames
    var nozMat = new T.MeshPhongMaterial({ color: 0x333a49, shininess: 110, specular: 0xdfeaff });
    var nozY = -hh * 0.18, nozZ = -hl * 0.99;
    [-1, 1].forEach(function (s) {
      var noz = new T.Mesh(new T.CylinderGeometry(0.10, 0.135, 0.20, 10), nozMat);
      noz.rotation.x = Math.PI / 2;
      noz.position.set(s * B.W * 0.20, nozY, nozZ);
      root.add(noz);

      var flame = new T.Mesh(
        new T.ConeGeometry(0.16, 1.5, 9, 1, true),
        new T.MeshBasicMaterial({
          color: 0xffb43c, transparent: true, opacity: 0.9,
          blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide
        })

      blending: T.AdditiveBlending, depthWrite: false

      new T.PlaneGeometry(1, 1),

  Ball.prototype.reset = function (x, y, z, vx, vy, vz) {

      recover: 0.35, speedCtl: 0.35, savvy: 0.25, kickoffLag: 0.85

/* ============================================================
   fx.js — particles and impact flourishes.

   Everything lives in two pooled Points clouds plus a small ring pool,
   so the whole effects layer costs about three draw calls no matter

   is the same thing as "fade out".

  'use strict';
  var RL = global.RL, T = global.THREE, M = RL.M;

    this.vel = new Float32Array(count * 3);
    this.life = new Float32Array(count);
    this.decay = new Float32Array(count);
    this.base = new Float32Array(count * 3);
    this.drag = new Float32Array(count);
    this.cursor = 0;

    for (var i = 0; i < count; i++) this.pos[i * 3 + 1] = -999;

    var geo = new T.BufferGeometry();
    geo.setAttribute('position', new T.BufferAttribute(this.pos, 3));
    geo.setAttribute('color', new T.BufferAttribute(this.col, 3));
    var mat = new T.PointsMaterial({
      size: size, map: texture, vertexColors: true, transparent: true,
      blending: T.AdditiveBlending, depthWrite: false, sizeAttenuation: true,

    var i = this.cursor;
    this.cursor = (this.cursor + 1) % this.n;
    var i3 = i * 3;
    this.pos[i3] = x; this.pos[i3 + 1] = y; this.pos[i3 + 2] = z;
    this.vel[i3] = vx; this.vel[i3 + 1] = vy; this.vel[i3 + 2] = vz;
    this.base[i3] = r; this.base[i3 + 1] = g; this.base[i3 + 2] = b;
    this.col[i3] = r; this.col[i3 + 1] = g; this.col[i3 + 2] = b;

    this.decay[i] = 1 / Math.max(0.05, life);

  Pool.prototype.update = function (dt) {

      this.life[i] -= this.decay[i] * dt;
      if (this.life[i] <= 0) {
        this.col[i3] = this.col[i3 + 1] = this.col[i3 + 2] = 0;
        this.pos[i3 + 1] = -999;

      this.pos[i3 + 1] += this.vel[i3 + 1] * dt;
