<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Rocket Rumble — R3's Turbo League</title>
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070b18">
  <meta name="description" content="A 3D rocket-powered car football game built for Roland N. Emokpae III.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rocket Rumble">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <canvas id="gl"></canvas>

  <!-- ============ heads-up display ============ -->
  <div id="hud">
    <div id="scorebar">
      <div class="team t0"><span class="tname">BLUE</span><span id="sc0" class="sc">0</span></div>
      <div id="clock">5:00</div>
      <div class="team t1"><span id="sc1" class="sc">0</span><span class="tname">ORANGE</span></div>
    </div>

    <div id="hudTop">
      <button id="btnPause" class="hudbtn" aria-label="Pause">❚❚</button>
      <button id="btnCam" class="hudbtn" aria-label="Ball camera">◎</button>
      <button id="btnMode" class="hudbtn" aria-label="Camera view">▣</button>
      <span id="camview" class="pill on">CHASE</span>
      <span id="ballcam" class="pill">BALL CAM</span>
    </div>

    <div id="boostRing">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="bg" cx="60" cy="60" r="50" />
      </svg>
      <div id="boostNum">33</div>
      <div id="boostBar"><span id="boostFill"></span></div>
      <div class="blabel">BOOST</div>
    </div>

    <div id="speedo"><span id="speed">0</span><span class="unit">KPH</span></div>

    <div id="banner"></div>
    <div id="bigtext"></div>
    <div id="toast"></div>
    <div id="hints"></div>
    <div id="ballArrow">➤</div>
  </div>

  <div id="flash"></div>

  <!-- ============ touch controls ============ -->
  <div id="touch">
    <div id="tStick">
      <div id="tKnob"></div>
    </div>
    <div id="tPad">
      <button id="tBoost" class="tbtn big boost">BOOST</button>
      <button id="tJump" class="tbtn big jump">JUMP</button>
      <button id="tBrake" class="tbtn small">BRAKE</button>
      <button id="tDrift" class="tbtn small">SLIDE</button>
      <button id="tRoll" class="tbtn small">ROLL</button>
    </div>
  </div>

  <!-- ============ menus ============ -->
  <div id="overlay">
    <div id="scr-title" class="screen"></div>
    <div id="scr-season" class="screen"></div>
    <div id="scr-exhibition" class="screen"></div>
    <div id="scr-garage" class="screen"></div>
    <div id="scr-settings" class="screen"></div>
    <div id="scr-controls" class="screen"></div>
    <div id="scr-howto" class="screen"></div>
    <div id="scr-pause" class="screen"></div>
    <div id="scr-results" class="screen"></div>
  </div>

  <div id="rotate">
    <div>
      <div class="ricon">📱</div>
      <p>Turn your phone sideways to play.</p>
    </div>
  </div>

  <script src="js/three.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/car.js"></script>
  <script src="js/ball.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/input.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
